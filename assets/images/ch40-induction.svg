<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><rect width="760" height="900" fill="#f8fafc"/><g fill="#18354e" font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="49" text-anchor="start" font-size="30">请求序列：归纳连接每一步</text><text x="34" y="91" text-anchor="start" font-size="24">successes(n,s)：处理 n 个请求的成功次数</text><rect x="55" y="135" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="172" text-anchor="middle" font-size="27">① 协议定义</text><text x="380" y="213" text-anchor="middle" font-size="25">paid → 成功并转 refunded；refunded → 拒绝</text><path d="M380 260 V286" stroke="#526f89" stroke-width="3"/><polygon points="380,299 373,285 387,285" fill="#526f89"/><rect x="55" y="300" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="337" text-anchor="middle" font-size="27">② 引理：从 refunded 出发</text><text x="380" y="378" text-anchor="middle" font-size="25">基例 0 次；再来一次仍拒绝，次数保持 0</text><path d="M380 425 V451" stroke="#526f89" stroke-width="3"/><polygon points="380,464 373,450 387,450" fill="#526f89"/><rect x="55" y="465" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="502" text-anchor="middle" font-size="27">③ 从 paid 出发处理 n+1 次</text><text x="380" y="543" text-anchor="middle" font-size="25">第一步成功 1 次；剩余 n 次全部为 0</text><path d="M380 590 V616" stroke="#526f89" stroke-width="3"/><polygon points="380,629 373,615 387,615" fill="#526f89"/><rect x="55" y="630" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="667" text-anchor="middle" font-size="27">④ 任意有限序列的结论</text><text x="380" y="708" text-anchor="middle" font-size="25">successes(n,s) ≤ 1</text><text x="34" y="846" text-anchor="start" font-size="24">这里只数模型成功转换；真实付款事件需另建对应。</text></g></svg>