<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#486d8a"/></marker></defs><rect width="1000" height="620" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17334d"><text x="42" y="48" font-size="28" text-anchor="start" fill="#17334d">一条规则结论，依赖整条证据链</text><rect x="55" y="105" width="380" height="100" rx="14" fill="#dcecff" stroke="#9db8ca" stroke-width="1.5"/><text x="245.0" y="146.7" font-size="22" text-anchor="middle" fill="#17334d">前端：程序 → 事实</text><text x="245.0" y="178.7" font-size="22" text-anchor="middle" fill="#17334d">函数 ID、调用边、数据边</text><rect x="565" y="105" width="380" height="100" rx="14" fill="#d9f3eb" stroke="#9db8ca" stroke-width="1.5"/><text x="755.0" y="146.7" font-size="22" text-anchor="middle" fill="#17334d">引擎：事实 + 规则</text><text x="755.0" y="178.7" font-size="22" text-anchor="middle" fill="#17334d">求不动点，产生关系</text><line x1="435" y1="155" x2="565" y2="155" stroke="#486d8a" stroke-width="2.5"/><polygon points="565,155 553.0,160.0 553.0,150.0" fill="#486d8a"/><rect x="565" y="315" width="380" height="100" rx="14" fill="#d9f3eb" stroke="#9db8ca" stroke-width="1.5"/><text x="755.0" y="356.7" font-size="22" text-anchor="middle" fill="#17334d">解释：结论 → 推导树</text><text x="755.0" y="388.7" font-size="22" text-anchor="middle" fill="#17334d">元组、规则、来源位置</text><line x1="755" y1="205" x2="755" y2="315" stroke="#486d8a" stroke-width="2.5"/><polygon points="755,315 750.0,303.0 760.0,303.0" fill="#486d8a"/><rect x="55" y="315" width="380" height="100" rx="14" fill="#ffebd3" stroke="#9db8ca" stroke-width="1.5"/><text x="245.0" y="356.7" font-size="22" text-anchor="middle" fill="#17334d">复核：回到程序语义</text><text x="245.0" y="388.7" font-size="22" text-anchor="middle" fill="#17334d">路径可行？模型完整？</text><line x1="565" y1="365" x2="435" y2="365" stroke="#486d8a" stroke-width="2.5"/><polygon points="435,365 447.0,360.0 447.0,370.0" fill="#486d8a"/><text x="55" y="500" font-size="22" text-anchor="start" fill="#17334d">规则证明：该结论可由输入事实推出。</text><text x="55" y="545" font-size="22" text-anchor="start" fill="#17334d">程序证明：还需输入事实与真实语义之间的保证。</text></g></svg>