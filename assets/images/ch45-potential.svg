<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#2563a6"/></marker></defs><rect width="760" height="900" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324d"><text x="32" y="47" font-size="30">两栈队列：势能支付偶尔昂贵的转移</text><text x="32" y="94" font-size="24">计费：每次栈 push/pop 为 1；Φ = 2 × |in|</text><rect x="32" y="140" width="696" height="140" rx="14" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="56" y="177" font-size="28">① 空队列开始</text><text x="56" y="222" font-size="26">|in|=0；|out|=0；Φ=0</text><text x="56" y="260" font-size="26">势能是证明中的记账量，不是实际存储</text><path d="M380,280 L380,312" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="320" width="696" height="140" rx="14" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="56" y="357" font-size="28">② 连续入队 3 次</text><text x="56" y="402" font-size="26">实际成本：1+1+1=3；Φ：0 → 6</text><text x="56" y="440" font-size="26">每次摊还：1 + 2 = 3</text><path d="M380,460 L380,492" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="500" width="696" height="140" rx="14" fill="#fff0df" stroke="#cc7628" stroke-width="2"/><text x="56" y="537" font-size="28">③ 首次出队：转移 3 个再弹出</text><text x="56" y="582" font-size="26">实际：2×3+1=7；Φ：6 → 0</text><text x="56" y="620" font-size="26">摊还：7 + (0-6) = 1</text><path d="M380,640 L380,672" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="680" width="696" height="140" rx="14" fill="#e0f3ef" stroke="#218679" stroke-width="2"/><text x="56" y="717" font-size="28">④ 再出队一次</text><text x="56" y="762" font-size="26">实际：1；Φ 不变；摊还：1</text><text x="56" y="800" font-size="26">五次总实际：11；总摊还：11</text><text x="32" y="873" font-size="24">摊还常数约束操作序列，不保证每次操作延迟恒定。</text></g></svg>