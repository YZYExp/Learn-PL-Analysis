<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img"><title>保证必须逐层连接</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#486a87"/></marker></defs><rect width="760" height="900" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324e"><text x="36" y="51" font-size="30" font-weight="700">保证必须逐层连接</text><text x="36" y="91" font-size="24" fill="#50677e">每条向下的箭头都增加相应证明义务</text><rect x="40" y="130" width="680" height="130" rx="15" fill="#e4eefb" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="165" font-size="25" font-weight="700">1 需求与观察</text><text x="62" y="198" font-size="25">定义退款成功、重复与可见结果</text><text x="62" y="231" font-size="25">检查是否遗漏功能性与活性要求</text><line x1="380" y1="265" x2="380" y2="292" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="300" width="680" height="130" rx="15" fill="#dff2ec" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="335" font-size="25" font-weight="700">2 抽象模型</text><text x="62" y="368" font-size="25">明确初态、动作与环境假设</text><text x="62" y="401" font-size="25">证明模型内的不变量或其他性质</text><line x1="380" y1="435" x2="380" y2="462" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="470" width="680" height="130" rx="15" fill="#e4eefb" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="505" font-size="25" font-weight="700">3 具体程序</text><text x="62" y="538" font-size="25">说明数据表示和动作如何对应</text><text x="62" y="571" font-size="25">不能把中间步骤直接当作原子动作</text><line x1="380" y1="605" x2="380" y2="632" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="640" width="680" height="150" rx="15" fill="#fff0dc" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="675" font-size="25" font-weight="700">4 部署与外部环境</text><text x="62" y="708" font-size="25">核对构建、数据库和支付协议</text><text x="62" y="741" font-size="25">证明或验证所用环境假设</text><text x="62" y="774" font-size="25">保留未覆盖的故障与未知</text><text x="40" y="877" font-size="24" fill="#50677e">模型定理 ≠ 未经对应论证的生产保证</text></g></svg>