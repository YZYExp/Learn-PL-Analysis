<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>同一种状态机表达，不同的对象含义</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#426481"/></marker></defs><rect width="1000" height="600" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#16324f"><text x="40" y="51" font-size="29" font-weight="700">同一种状态机表达，不同的对象含义</text><text x="40" y="87" font-size="20" fill="#50667d">原创精确图解 · 蓝：程序信息　青：满足条件　橙：需要关注</text><text x="40" y="143" font-size="23">文件资源（简化协议）</text><rect x="40" y="175" width="230" height="100" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="60" y="210" font-size="24">未打开</text><text x="60" y="244" font-size="24">无可用句柄</text><rect x="385" y="175" width="230" height="100" rx="14" fill="#e1f3ed" stroke="#adc2d5"/><text x="405" y="210" font-size="24">已打开</text><text x="405" y="244" font-size="24">允许 read</text><rect x="730" y="175" width="230" height="100" rx="14" fill="#fff0d9" stroke="#adc2d5"/><text x="750" y="210" font-size="24">已关闭</text><text x="750" y="244" font-size="24">禁止继续 read</text><line x1="270" y1="225" x2="385" y2="225" stroke="#426481" stroke-width="3" marker-end="url(#arrow)"/><line x1="615" y1="225" x2="730" y2="225" stroke="#426481" stroke-width="3" marker-end="url(#arrow)"/><text x="290" y="205" font-size="21">open</text><text x="635" y="205" font-size="21">close</text><text x="40" y="355" font-size="23">订单协议（只允许一次全额退款的教学模型）</text><rect x="40" y="395" width="270" height="110" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="60" y="430" font-size="24">paid</text><text x="60" y="464" font-size="24">尚未成功退款</text><rect x="650" y="395" width="310" height="110" rx="14" fill="#e1f3ed" stroke="#adc2d5"/><text x="670" y="430" font-size="24">refunded</text><text x="670" y="464" font-size="24">重复请求返回旧结果</text><line x1="310" y1="450" x2="650" y2="450" stroke="#426481" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="424" font-size="23">成功退款</text><text x="55" y="557" font-size="22">部分退款需要累计金额与更细条件；不能直接套用此图。</text></g></svg>