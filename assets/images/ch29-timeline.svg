<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="600" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="55" font-size="30" fill="#17324d" text-anchor="start">kernel 更快，端到端仍可能更慢</text><text x="40" y="97" font-size="21" fill="#17324d" text-anchor="start">构造的教学数据；时间块按 60 px / ms 绘制，不代表设备实测</text><text x="55" y="165" font-size="24" fill="#17324d" text-anchor="start">CPU</text><text x="55" y="315" font-size="24" fill="#17324d" text-anchor="start">GPU</text><rect x="155" y="125" width="480" height="75" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="395.0" y="170.5" font-size="23" fill="#17324d" text-anchor="middle">计算 8 ms</text><rect x="155" y="275" width="240" height="75" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="275.0" y="320.5" font-size="23" fill="#17324d" text-anchor="middle">传入 4 ms</text><rect x="395" y="275" width="60" height="75" rx="14" fill="#fff2df" stroke="#c76a19" stroke-width="2"/><text x="425.0" y="320.5" font-size="23" fill="#17324d" text-anchor="middle">协调</text><rect x="455" y="275" width="60" height="75" rx="14" fill="#e7f5f2" stroke="#0f766e" stroke-width="2"/><text x="485.0" y="320.5" font-size="23" fill="#17324d" text-anchor="middle">计算</text><rect x="515" y="275" width="180" height="75" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="605.0" y="320.5" font-size="23" fill="#17324d" text-anchor="middle">传回 3 ms</text><text x="355" y="390" font-size="22" fill="#17324d" text-anchor="start">协调 1 ms + 计算 1 ms</text><rect x="95" y="460" width="810" height="75" rx="14" fill="#fff2df" stroke="#c76a19" stroke-width="2"/><text x="500.0" y="505.5" font-size="23" fill="#17324d" text-anchor="middle">串行假设：CPU 总计 8 ms，GPU 总计 9 ms</text></g></svg>