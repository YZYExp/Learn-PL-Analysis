<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#2563a6"/></marker></defs><rect width="760" height="900" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324d"><text x="32" y="47" font-size="30">字符串分析：内容与长度一起传播</text><text x="32" y="94" font-size="24">length 按本例 ASCII 字符计数；正则完整匹配</text><rect x="32" y="140" width="696" height="140" rx="14" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="56" y="177" font-size="28">① 输入约束</text><text x="56" y="222" font-size="26">digits ∈ [0-9]{1,4}</text><text x="56" y="260" font-size="26">长度范围为 [1,4]；只含 ASCII 数字</text><path d="M380,280 L380,312" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="320" width="696" height="140" rx="14" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="56" y="357" font-size="28">② 执行拼接</text><text x="56" y="402" font-size="26">key = &quot;R_&quot; + digits</text><text x="56" y="440" font-size="26">固定前缀的长度为 2</text><path d="M380,460 L380,492" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="500" width="696" height="140" rx="14" fill="#fff0df" stroke="#cc7628" stroke-width="2"/><text x="56" y="537" font-size="28">③ 分别计算抽象结果</text><text x="56" y="582" font-size="26">语言：R_[0-9]{1,4}；前缀：R_</text><text x="56" y="620" font-size="26">长度：[2+1, 2+4] = [3,6]</text><path d="M380,640 L380,672" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="680" width="696" height="140" rx="14" fill="#e0f3ef" stroke="#218679" stroke-width="2"/><text x="56" y="717" font-size="28">④ 检查两个断言</text><text x="56" y="762" font-size="26">starts_with(key,&quot;R_&quot;)：成立</text><text x="56" y="800" font-size="26">3 ≤ length(key) ≤ 6：成立</text><text x="32" y="873" font-size="24">长度正确不代表内容正确；需保留目标性质的信息。</text></g></svg>