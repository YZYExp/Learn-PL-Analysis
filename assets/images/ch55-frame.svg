<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><rect width="760" height="900" fill="#f8fafc"/><g fill="#18354e" font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="49" text-anchor="start" font-size="30">有限堆：局部写入保存独立框架</text><text x="34" y="91" text-anchor="start" font-size="24">地址类型 Fin.t bound；每地址为 None 或 Some v</text><rect x="55" y="135" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="169" text-anchor="middle" font-size="27">① 拆开前置资源</text><text x="380" y="211" text-anchor="middle" font-size="25">(p ↦ old) * R</text><text x="380" y="245" text-anchor="middle" font-size="25">分成单元子堆与框架子堆</text><path d="M380 260 V286" stroke="#526f89" stroke-width="3"/><polygon points="380,299 373,285 387,285" fill="#526f89"/><rect x="55" y="300" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="334" text-anchor="middle" font-size="27">② 从分离得到关键事实</text><text x="380" y="376" text-anchor="middle" font-size="25">单元子堆在 p 处非空</text><text x="380" y="410" text-anchor="middle" font-size="25">因此框架在 p 处必须为 None</text><path d="M380 425 V451" stroke="#526f89" stroke-width="3"/><polygon points="380,464 373,450 387,450" fill="#526f89"/><rect x="55" y="465" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="499" text-anchor="middle" font-size="27">③ 只更新局部地址</text><text x="380" y="541" text-anchor="middle" font-size="25">p 处改成 Some new</text><text x="380" y="575" text-anchor="middle" font-size="25">每个 q ≠ p 的结果保持不变</text><path d="M380 590 V616" stroke="#526f89" stroke-width="3"/><polygon points="380,629 373,615 387,615" fill="#526f89"/><rect x="55" y="630" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="664" text-anchor="middle" font-size="27">④ 重组后置资源</text><text x="380" y="706" text-anchor="middle" font-size="25">(p ↦ new) * R</text><text x="380" y="740" text-anchor="middle" font-size="25">同一份框架 R 原样保留</text><text x="34" y="846" text-anchor="start" font-size="24">这是纯 Rocq 有限模型；不包含 C 字节布局与对齐。</text></g></svg>