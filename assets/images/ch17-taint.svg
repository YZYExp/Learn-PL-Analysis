<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#486d8a"/></marker></defs><rect width="1000" height="620" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17334d"><text x="42" y="48" font-size="28" text-anchor="start" fill="#17334d">清洗返回新值，不会自动改写旧值</text><rect x="330" y="95" width="340" height="85" rx="14" fill="#ffebd3" stroke="#9db8ca" stroke-width="1.5"/><text x="500.0" y="145.2" font-size="22" text-anchor="middle" fill="#17334d">name：外部来源</text><rect x="330" y="245" width="340" height="85" rx="14" fill="#ffebd3" stroke="#9db8ca" stroke-width="1.5"/><text x="500.0" y="295.2" font-size="22" text-anchor="middle" fill="#17334d">message：拼接结果</text><line x1="500" y1="180" x2="500" y2="245" stroke="#486d8a" stroke-width="2.5"/><polygon points="500,245 495.0,233.0 505.0,233.0" fill="#486d8a"/><rect x="45" y="420" width="420" height="100" rx="14" fill="#d9f3eb" stroke="#9db8ca" stroke-width="1.5"/><text x="255.0" y="461.85" font-size="21" text-anchor="middle" fill="#17334d">safe = escape_html_text(message)</text><text x="255.0" y="492.85" font-size="21" text-anchor="middle" fill="#17334d">获得 HTML 文本处理标记</text><rect x="565" y="420" width="390" height="100" rx="14" fill="#ffebd3" stroke="#9db8ca" stroke-width="1.5"/><text x="760.0" y="461.85" font-size="21" text-anchor="middle" fill="#17334d">render_html_text(message)</text><text x="760.0" y="492.85" font-size="21" text-anchor="middle" fill="#17334d">原值未处理：报告</text><line x1="415" y1="330" x2="255" y2="420" stroke="#486d8a" stroke-width="2.5"/><polygon points="255,420 263.00760024733177,409.75898743878656 267.91021264365736,418.474742810032" fill="#486d8a"/><line x1="585" y1="330" x2="760" y2="420" stroke="#486d8a" stroke-width="2.5"/><polygon points="760,420 747.0418063090784,418.9582628601416 751.6152864352861,410.06538483696016" fill="#486d8a"/><text x="65" y="580" font-size="22" text-anchor="start" fill="#17334d">safe 用于对应文本上下文；其他上下文需另核契约。</text></g></svg>