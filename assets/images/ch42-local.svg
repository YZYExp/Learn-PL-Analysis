<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><rect width="760" height="900" fill="#f8fafc"/><g fill="#18354e" font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="49" text-anchor="start" font-size="30">局部可靠性：分两种抽象值证明</text><text x="34" y="91" text-anchor="start" font-size="24">具体转换 inc(z)=z+1；γ 表示覆盖关系</text><rect x="55" y="135" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="172" text-anchor="middle" font-size="27">① 输入义务</text><text x="380" y="213" text-anchor="middle" font-size="25">已知 γ(a,z)，目标 γ(incAbs(a),z+1)</text><path d="M380 260 V286" stroke="#526f89" stroke-width="3"/><polygon points="380,299 373,285 387,285" fill="#526f89"/><rect x="55" y="300" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="337" text-anchor="middle" font-size="27">② 证明分支：a = nonneg</text><text x="380" y="378" text-anchor="middle" font-size="25">由 z≥0 推出 z+1≥0；输出仍是 nonneg</text><path d="M380 425 V451" stroke="#526f89" stroke-width="3"/><polygon points="380,464 373,450 387,450" fill="#526f89"/><rect x="55" y="465" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="502" text-anchor="middle" font-size="27">③ 证明分支：a = any</text><text x="380" y="543" text-anchor="middle" font-size="25">输出仍是 any；任意整数均被覆盖</text><path d="M380 590 V616" stroke="#526f89" stroke-width="3"/><polygon points="380,629 373,615 387,615" fill="#526f89"/><rect x="55" y="630" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="667" text-anchor="middle" font-size="27">④ 合并两个证明分支</text><text x="380" y="708" text-anchor="middle" font-size="25">所有抽象输入均保持覆盖：inc_sound</text><text x="34" y="846" text-anchor="start" font-size="24">错误改写：any→nonneg；z=−2 加一后仍为负。</text></g></svg>