<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>一个退款函数，四种分析问题</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#426481"/></marker></defs><rect width="1000" height="600" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#16324f"><text x="40" y="51" font-size="29" font-weight="700">一个退款函数，四种分析问题</text><text x="40" y="87" font-size="20" fill="#50667d">原创精确图解 · 蓝：程序信息　青：满足条件　橙：需要关注</text><rect x="40" y="130" width="440" height="165" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="60" y="165" font-size="24">结构：哪些分支和调用？</text><text x="60" y="199" font-size="24">保留语法、控制流与依赖</text><text x="60" y="233" font-size="24">输出：图与关系</text><rect x="520" y="130" width="440" height="165" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="540" y="165" font-size="24">执行：这次发生了什么？</text><text x="540" y="199" font-size="24">给定输入并记录行为</text><text x="540" y="233" font-size="24">输出：轨迹与观测</text><rect x="40" y="335" width="440" height="165" rx="14" fill="#e1f3ed" stroke="#adc2d5"/><text x="60" y="370" font-size="24">性质：金额一定合规吗？</text><text x="60" y="404" font-size="24">明确前提并推导所有可能</text><text x="60" y="438" font-size="24">输出：证明、候选或未知</text><rect x="520" y="335" width="440" height="165" rx="14" fill="#fff0d9" stroke="#adc2d5"/><text x="540" y="370" font-size="24">成本：时间花在哪里？</text><text x="540" y="404" font-size="24">指定环境与测量阶段</text><text x="540" y="438" font-size="24">输出：时间线与热点</text><text x="65" y="553" font-size="23">结论必须携带：对象 · 性质 · 模型 · 覆盖范围 · 未知</text></g></svg>