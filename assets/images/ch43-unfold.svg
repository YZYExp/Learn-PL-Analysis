<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#2563a6"/></marker></defs><rect width="760" height="900" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324d"><text x="32" y="47" font-size="30">展开链表：把摘要变成可操作资源</text><text x="32" y="94" font-size="24">模型：有限无环链；节点按完整记录占一个单元</text><rect x="32" y="140" width="696" height="140" rx="14" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="56" y="177" font-size="28">① 输入：拥有一条非空链</text><text x="56" y="222" font-size="26">p ≠ null 且 list(p)</text><text x="56" y="260" font-size="26">尚未展开：长度可以是任意正整数</text><path d="M380,280 L380,312" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="320" width="696" height="140" rx="14" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="56" y="357" font-size="28">② 展开一次归纳定义</text><text x="56" y="402" font-size="26">存在 v、q：p ↦ Node(v,q) * list(q)</text><text x="56" y="440" font-size="26">头节点与尾链的拥有地址域不重叠</text><path d="M380,460 L380,492" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="500" width="696" height="140" rx="14" fill="#fff0df" stroke="#cc7628" stroke-width="2"/><text x="56" y="537" font-size="28">③ 读取 next，再释放头节点</text><text x="56" y="582" font-size="26">q = p.next；free(p)</text><text x="56" y="620" font-size="26">读取需要节点权限；释放消耗头节点</text><path d="M380,640 L380,672" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="680" width="696" height="140" rx="14" fill="#e0f3ef" stroke="#218679" stroke-width="2"/><text x="56" y="717" font-size="28">④ 输出：返回尾链的头 q</text><text x="56" y="762" font-size="26">仍拥有 list(q)</text><text x="56" y="800" font-size="26">旧 p 的别名可存在，但不能再解引用</text><text x="32" y="873" font-size="24">结论：保留尾链；不能把同一份所有权复制两次。</text></g></svg>