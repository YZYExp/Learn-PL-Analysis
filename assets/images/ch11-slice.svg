<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#2563a6"/></marker><marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#cc7628"/></marker></defs><rect width="1000" height="620" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324d"><text x="40" y="47" font-size="28" fill="#17324d">后向切片：返回的 refund 从哪里来</text><text x="40" y="82" font-size="21" fill="#17324d">准则：第 8 行 refund；本例假定 log 不影响程序状态与终止</text><path d="M210,180 L330,310" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><path d="M500,180 L410,310" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><path d="M780,180 L575,310" fill="none" stroke="#cc7628" stroke-width="3" marker-end="url(#orange)"/><path d="M400,385 L500,475" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><path d="M780,385 L610,475" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><rect x="65" y="120" width="270" height="60" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="82" y="151" font-size="22" fill="#17324d">1 amount = input</text><rect x="365" y="120" width="270" height="60" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="382" y="151" font-size="22" fill="#17324d">2 fee = 20</text><rect x="665" y="120" width="270" height="60" rx="12" fill="#fff0df" stroke="#cc7628" stroke-width="2"/><text x="682" y="151" font-size="22" fill="#17324d">5 if is_paid</text><rect x="185" y="310" width="440" height="75" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="202" y="341" font-size="22" fill="#17324d">6 refund = amount - fee</text><rect x="680" y="310" width="260" height="75" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="697" y="341" font-size="22" fill="#17324d">4 refund = 0</text><rect x="350" y="475" width="300" height="60" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="367" y="506" font-size="22" fill="#17324d">8 return refund</text><rect x="35" y="475" width="260" height="60" rx="12" fill="#eef0f2" stroke="#9ca8b3" stroke-width="2"/><text x="52" y="506" font-size="22" fill="#17324d">7 log(debug)</text><text x="40" y="585" font-size="21" fill="#17324d">蓝：数据依赖    橙：控制依赖    灰：在指定模型下排除</text></g></svg>