<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#2563a6"/></marker><marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#cc7628"/></marker></defs><rect width="1000" height="620" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324d"><text x="40" y="47" font-size="28" fill="#17324d">SSA 合流：按前驱边选择值</text><text x="40" y="82" font-size="21" fill="#17324d">教学 IR；is_paid 为真取 amount，为假取 0</text><path d="M500,175 L260,260" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><path d="M500,175 L740,260" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><path d="M260,340 L430,440" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><path d="M740,340 L570,440" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><rect x="345" y="115" width="310" height="60" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="362" y="146" font-size="22" fill="#17324d">branch is_paid, yes, no</text><rect x="100" y="260" width="320" height="80" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="117" y="291" font-size="22" fill="#17324d">yes</text><text x="117" y="320" font-size="22" fill="#17324d">r1 = amount</text><rect x="580" y="260" width="320" height="80" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="597" y="291" font-size="22" fill="#17324d">no</text><text x="597" y="320" font-size="22" fill="#17324d">r2 = 0</text><rect x="280" y="440" width="440" height="90" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="297" y="471" font-size="22" fill="#17324d">merge</text><text x="297" y="500" font-size="22" fill="#17324d">r3 = phi(yes:r1, no:r2)</text><text x="260" y="220" font-size="22" fill="#17324d">真</text><text x="730" y="220" font-size="22" fill="#17324d">假</text><text x="40" y="585" font-size="22" fill="#17324d">phi 是选择，不是相加；一次运行只经过其中一条前驱边。</text></g></svg>