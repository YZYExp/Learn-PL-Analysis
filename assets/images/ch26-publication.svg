<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="600" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="55" font-size="30" fill="#17324d" text-anchor="start">一次性发布的 happens-before 路径</text><text x="40" y="97" font-size="21" fill="#17324d" text-anchor="start">假设：初始化完成；只有一次发布；发布后不再写 task</text><text x="120" y="155" font-size="25" fill="#17324d" text-anchor="start">生产者</text><text x="640" y="155" font-size="25" fill="#17324d" text-anchor="start">消费者</text><rect x="60" y="185" width="360" height="90" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="238.0" font-size="23" fill="#17324d" text-anchor="middle">A：task = 42</text><rect x="580" y="185" width="360" height="90" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="760.0" y="238.0" font-size="23" fill="#17324d" text-anchor="middle">D：读取 task</text><rect x="60" y="370" width="360" height="90" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="407.0" font-size="23" fill="#17324d" text-anchor="middle">B：ready.store</text><text x="240.0" y="439.0" font-size="23" fill="#17324d" text-anchor="middle">release</text><rect x="580" y="370" width="360" height="90" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="760.0" y="407.0" font-size="23" fill="#17324d" text-anchor="middle">C：ready.load</text><text x="760.0" y="439.0" font-size="23" fill="#17324d" text-anchor="middle">acquire 读到 B 的 true</text><path d="M240 280 L240.0 353.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="240,365 246.0,353.0 234.0,353.0" fill="#2563eb"/><path d="M760 365 L760.0 292.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="760,280 754.0,292.0 766.0,292.0" fill="#2563eb"/><path d="M425 415 L563.0 415.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="575,415 563.0,409.0 563.0,421.0" fill="#2563eb"/><text x="440" y="385" font-size="22" fill="#17324d" text-anchor="start">同步</text><text x="90" y="530" font-size="23" fill="#17324d" text-anchor="start">A → B → C → D：最终把任务写入排在任务读取之前。</text></g></svg>