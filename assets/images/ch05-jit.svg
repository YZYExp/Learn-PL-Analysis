<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>运行时专用执行需要检查与恢复</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#426481"/></marker></defs><rect width="1000" height="600" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#16324f"><text x="40" y="51" font-size="29" font-weight="700">运行时专用执行需要检查与恢复</text><text x="40" y="87" font-size="20" fill="#50667d">原创精确图解 · 蓝：程序信息　青：满足条件　橙：需要关注</text><rect x="40" y="135" width="330" height="100" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="60" y="170" font-size="24">输入与运行时状态</text><text x="60" y="204" font-size="24">保留语义进度</text><rect x="40" y="300" width="330" height="100" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="60" y="335" font-size="24">检查专用路径假设</text><text x="60" y="369" font-size="24">例如元素均为整数</text><rect x="615" y="135" width="345" height="100" rx="14" fill="#e1f3ed" stroke="#adc2d5"/><text x="635" y="170" font-size="24">专用机器代码</text><text x="635" y="204" font-size="24">检查成立时进入</text><rect x="615" y="350" width="345" height="125" rx="14" fill="#fff0d9" stroke="#adc2d5"/><text x="635" y="385" font-size="24">通用处理 / 状态恢复</text><text x="635" y="419" font-size="24">检查失败时进入</text><text x="635" y="453" font-size="24">禁止随意重做副作用</text><line x1="205" y1="235" x2="205" y2="300" stroke="#426481" stroke-width="3" marker-end="url(#arrow)"/><line x1="370" y1="325" x2="615" y2="185" stroke="#426481" stroke-width="3" marker-end="url(#arrow)"/><line x1="370" y1="375" x2="615" y2="410" stroke="#426481" stroke-width="3" marker-end="url(#arrow)"/><text x="430" y="252" font-size="23">成立</text><text x="440" y="415" font-size="23">失败</text><text x="50" y="550" font-size="22">示意条件结构，不表示某个引擎的完整流水线。</text></g></svg>