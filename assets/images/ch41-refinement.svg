<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><rect width="760" height="900" fill="#f8fafc"/><g fill="#18354e" font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="49" text-anchor="start" font-size="30">编译验证：逐层保持指定行为</text><text x="34" y="91" text-anchor="start" font-size="24">每阶段都需明确源/目标语义与适用前提</text><rect x="55" y="135" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="172" text-anchor="middle" font-size="27">① 源程序与目标规格</text><text x="380" y="213" text-anchor="middle" font-size="25">源状态、输入假设、可观察行为</text><path d="M380 260 V286" stroke="#526f89" stroke-width="3"/><polygon points="380,299 373,285 387,285" fill="#526f89"/><rect x="55" y="300" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="337" text-anchor="middle" font-size="27">② 中间表示与第一阶段证明</text><text x="380" y="378" text-anchor="middle" font-size="25">建立状态对应；检查观察行为保持</text><path d="M380 425 V451" stroke="#526f89" stroke-width="3"/><polygon points="380,464 373,450 387,450" fill="#526f89"/><rect x="55" y="465" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="502" text-anchor="middle" font-size="27">③ 目标汇编模型与组合定理</text><text x="380" y="543" text-anchor="middle" font-size="25">由阶段保证组合出本段语义保持</text><path d="M380 590 V616" stroke="#526f89" stroke-width="3"/><polygon points="380,629 373,615 387,615" fill="#526f89"/><rect x="55" y="630" width="650" height="125" rx="18" fill="#ffeedb" stroke="#bb8245" stroke-width="2"/><text x="380" y="667" text-anchor="middle" font-size="27">④ 外部边界仍需连接</text><text x="380" y="708" text-anchor="middle" font-size="25">汇编、链接、库、ABI 与实际执行环境</text><text x="34" y="846" text-anchor="start" font-size="24">正确编译传递源保证；不替源程序证明业务规格。</text></g></svg>