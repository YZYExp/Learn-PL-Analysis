<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2563eb"/></marker></defs><rect width="760" height="900" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#183153"><text x="42" y="45" font-size="30" font-weight="bold">减少无必要重算：比较真正依赖的信息</text><text x="42" y="78" font-size="24">输入变脏与摘要确实变化是不同状态</text><rect x="95" y="105" width="610" height="115" rx="14" fill="#dbeafe" stroke="#94a3b8"/><text x="118" y="136" font-size="25" font-weight="bold">输入：代码或模型变化</text><text x="118" y="171" font-size="25">验证快照，记录当前实际依赖</text><path d="M380,220 L380,273" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="280" width="610" height="115" rx="14" fill="#dbeafe" stroke="#94a3b8"/><text x="118" y="311" font-size="25" font-weight="bold">中间一：重算直接摘要</text><text x="118" y="346" font-size="25">使用当前语义、配置与库模型</text><path d="M380,395 L380,448" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="455" width="610" height="115" rx="14" fill="#ffedd5" stroke="#94a3b8"/><text x="118" y="486" font-size="25" font-weight="bold">中间二：比较规范化摘要</text><text x="118" y="521" font-size="25">比较消费者真正使用的字段</text><path d="M380,570 L380,623" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="630" width="610" height="115" rx="14" fill="#ccfbf1" stroke="#94a3b8"/><text x="118" y="661" font-size="25" font-weight="bold">结论：按变化传播</text><text x="118" y="696" font-size="25">相同可保留；不同或未知则失效</text><text x="42" y="800" font-size="24">新调用要新增依赖，删除调用要清理旧边。</text><text x="42" y="835" font-size="24">循环摘要需联合求解，不能假设依赖总是树。</text></g></svg>