<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#506580"/></marker></defs><rect width="760" height="900" fill="#FAFCFF"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#16324F">
<text x="35" y="50" font-size="32" font-weight="bold">问题温和，直接算法仍会失准</text>
<text x="35" y="92" font-size="24">数学函数 f(x) = √(x + 1) − √x，x &gt; 0</text>
<rect x="70" y="135" width="620" height="95" rx="14" fill="#E4EDFF" stroke="#B9CDDF" stroke-width="1.5"/>
<text x="380.0" y="173.5" font-size="26" text-anchor="middle">代数上等价的另一形式</text>
<text x="380.0" y="209.5" font-size="26" text-anchor="middle">f(x) = 1 / (√(x + 1) + √x)</text>
<path d="M380,230 L380,265" fill="none" stroke="#506580" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="265" width="620" height="150" rx="14" fill="#FFF0D9" stroke="#B9CDDF" stroke-width="1.5"/>
<text x="380.0" y="295.0" font-size="26" text-anchor="middle">取 x = 2^54，按 binary64 舍入</text>
<text x="380.0" y="331.0" font-size="26" text-anchor="middle">直接形式：x + 1 → x</text>
<text x="380.0" y="367.0" font-size="26" text-anchor="middle">两次平方根相同，差 → 0</text>
<text x="380.0" y="403.0" font-size="26" text-anchor="middle">丢失真实结果尺度</text>
<path d="M380,415 L380,450" fill="none" stroke="#506580" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="450" width="620" height="150" rx="14" fill="#DDF4ED" stroke="#B9CDDF" stroke-width="1.5"/>
<text x="380.0" y="480.0" font-size="26" text-anchor="middle">有理化形式避免相近结果相减</text>
<text x="380.0" y="516.0" font-size="26" text-anchor="middle">分母约为 2 × 2^27</text>
<text x="380.0" y="552.0" font-size="26" text-anchor="middle">结果约为 2^−28</text>
<text x="380.0" y="588.0" font-size="26" text-anchor="middle">精度分析仍需保留输入域与舍入规则</text>
<path d="M380,600 L380,635" fill="none" stroke="#506580" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="635" width="620" height="145" rx="14" fill="#EEF1F7" stroke="#B9CDDF" stroke-width="1.5"/>
<text x="380.0" y="662.5" font-size="26" text-anchor="middle">相对条件数 κ(x) = 0.5 √(x/(x + 1))</text>
<text x="380.0" y="698.5" font-size="26" text-anchor="middle">对正数 x，小于二分之一</text>
<text x="380.0" y="734.5" font-size="26" text-anchor="middle">条件数描述问题敏感性</text>
<text x="380.0" y="770.5" font-size="26" text-anchor="middle">稳定性描述具体算法的误差行为</text>
<text x="35" y="840" font-size="24" text-anchor="start">两种性质不能混为一谈；数值改写需要域与语义。</text>
</g></svg>