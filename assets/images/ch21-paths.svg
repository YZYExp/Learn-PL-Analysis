<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D6480"/></marker></defs><rect width="1000" height="600" fill="#FAFCFF"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#16324F">
<text x="45" y="55" font-size="30" font-weight="bold">退款路径上的约束怎样累积</text>
<text x="45" y="94" font-size="21">语义：数学整数；balance = 1000；无并发修改</text>
<rect x="380" y="125" width="240" height="65" rx="12" fill="#E5EFFF" stroke="#BCCDE0"/>
<text x="500.0" y="165.5" font-size="22" fill="#16324F" text-anchor="middle">输入：符号金额 a</text>
<rect x="80" y="255" width="260" height="85" rx="12" fill="#EDF0F5" stroke="#BCCDE0"/>
<text x="210.0" y="290.0" font-size="22" fill="#16324F" text-anchor="middle">a ≤ 0</text>
<text x="210.0" y="321.0" font-size="22" fill="#16324F" text-anchor="middle">拒绝</text>
<rect x="490" y="245" width="390" height="85" rx="12" fill="#E5EFFF" stroke="#BCCDE0"/>
<text x="685.0" y="280.0" font-size="22" fill="#16324F" text-anchor="middle">a &gt; 0</text>
<text x="685.0" y="311.0" font-size="22" fill="#16324F" text-anchor="middle">继续第二次判断</text>
<path d="M420,190 L210,255" fill="none" stroke="#4D6480" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M580,190 L685,245" fill="none" stroke="#4D6480" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="410" y="385" width="200" height="80" rx="12" fill="#EDF0F5" stroke="#BCCDE0"/>
<text x="510.0" y="417.5" font-size="22" fill="#16324F" text-anchor="middle">a &gt; 1000</text>
<text x="510.0" y="448.5" font-size="22" fill="#16324F" text-anchor="middle">拒绝</text>
<rect x="675" y="385" width="270" height="80" rx="12" fill="#DDF3EE" stroke="#BCCDE0"/>
<text x="810.0" y="417.5" font-size="22" fill="#16324F" text-anchor="middle">0 &lt; a ≤ 1000</text>
<text x="810.0" y="448.5" font-size="22" fill="#16324F" text-anchor="middle">remaining = 1000 − a</text>
<path d="M600,330 L510,385" fill="none" stroke="#4D6480" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M770,330 L810,385" fill="none" stroke="#4D6480" stroke-width="2.5" marker-end="url(#a)"/>
<text x="45" y="561" font-size="20" fill="#16324F" text-anchor="start">错误查询：0 &lt; a ≤ 1000 且 1000 − a &lt; 0；本例不可满足。</text>
</g></svg>