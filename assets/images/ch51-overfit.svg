<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2563eb"/></marker></defs><rect width="760" height="900" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#183153"><text x="42" y="45" font-size="30" font-weight="bold">弱测试允许错误补丁：退款夹取例子</text><text x="42" y="78" font-size="24">规格：负请求归零，超额只批准可用余额</text><rect x="95" y="105" width="610" height="115" rx="14" fill="#dbeafe" stroke="#94a3b8"/><text x="118" y="136" font-size="25" font-weight="bold">输入：最初只有一个观察</text><text x="118" y="171" font-size="25">余额 0，请求 0，期望 0</text><path d="M380,220 L380,273" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="280" width="610" height="115" rx="14" fill="#ffedd5" stroke="#94a3b8"/><text x="118" y="311" font-size="25" font-weight="bold">中间一：多个候选都能通过</text><text x="118" y="346" font-size="25">返回 0 / 返回请求 / 夹取表达式</text><path d="M380,395 L380,448" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="455" width="610" height="115" rx="14" fill="#ffedd5" stroke="#94a3b8"/><text x="118" y="486" font-size="25" font-weight="bold">中间二：加入反例检查</text><text x="118" y="521" font-size="25">余额 1，请求 1，返回 0 不正确</text><path d="M380,570 L380,623" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="630" width="610" height="115" rx="14" fill="#ccfbf1" stroke="#94a3b8"/><text x="118" y="661" font-size="25" font-weight="bold">结论：测试变绿仍不足以验收</text><text x="118" y="696" font-size="25">候选还需满足完整规格与行为边界</text><text x="42" y="800" font-size="24">十八组有限输入检查不是无限域上的证明。</text><text x="42" y="835" font-size="24">参考规格本身也必须符合真实业务需求。</text></g></svg>