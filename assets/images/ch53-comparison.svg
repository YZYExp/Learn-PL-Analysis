<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img"><title>同题对照的四层核查</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#466782"/></marker></defs><rect width="760" height="900" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324e"><text x="32" y="49" font-size="30" font-weight="700">同题对照的四层核查</text><text x="32" y="91" font-size="24" fill="#526a80">分别检查，不把相似语法当作跨系统证明</text><rect x="32" y="130" width="696" height="130" rx="14" fill="#e3eefb" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="165" font-size="25" font-weight="700">1 数学对象</text><text x="52" y="199" font-size="25">有限布尔列表与自然数</text><text x="52" y="233" font-size="25">量词范围相同：任意有限长度</text><line x1="380" y1="264" x2="380" y2="292" stroke="#466782" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="300" width="696" height="150" rx="14" fill="#e3eefb" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="335" font-size="25" font-weight="700">2 两份独立定义</text><text x="52" y="369" font-size="25">Lean：acceptedCount</text><text x="52" y="403" font-size="25">Rocq：accepted_count</text><text x="52" y="437" font-size="25">各自核对分支与递归参数</text><line x1="380" y1="454" x2="380" y2="462" stroke="#466782" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="470" width="696" height="130" rx="14" fill="#dff2eb" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="505" font-size="25" font-weight="700">3 各自的证明项</text><text x="52" y="539" font-size="25">归纳假设与目标逐分支匹配</text><text x="52" y="573" font-size="25">两个内核分别检查对应证明</text><line x1="380" y1="604" x2="380" y2="632" stroke="#466782" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="640" width="696" height="150" rx="14" fill="#fff0dc" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="675" font-size="25" font-weight="700">4 版本、命令与依赖记录</text><text x="52" y="709" font-size="25">查看 Lean 公理与 Rocq 假设查询</text><text x="52" y="743" font-size="25">保留实际运行结果</text><text x="52" y="777" font-size="25">不据此宣称业务系统已经验证</text><text x="32" y="877" font-size="24" fill="#526a80">跨系统语义等价需要额外的正式对应论证</text></g></svg>