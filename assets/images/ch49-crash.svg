<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2563eb"/></marker></defs><rect width="760" height="900" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#183153"><text x="42" y="45" font-size="30" font-weight="bold">崩溃窗口：执行位置丢失，效果保留</text><text x="42" y="78" font-size="24">假定先调用网关，再提交本地完成状态</text><rect x="95" y="105" width="610" height="115" rx="14" fill="#dbeafe" stroke="#94a3b8"/><text x="118" y="136" font-size="25" font-weight="bold">输入：可接受的初态</text><text x="118" y="171" font-size="25">本地 paid；外部退款次数 0</text><path d="M380,220 L380,273" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="280" width="610" height="115" rx="14" fill="#ccfbf1" stroke="#94a3b8"/><text x="118" y="311" font-size="25" font-weight="bold">中间一：网关已经成功</text><text x="118" y="346" font-size="25">本地仍为 paid；外部次数 1</text><path d="M380,395 L380,448" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="455" width="610" height="115" rx="14" fill="#ffedd5" stroke="#94a3b8"/><text x="118" y="486" font-size="25" font-weight="bold">中间二：确认前崩溃并重启</text><text x="118" y="521" font-size="25">执行位置丢失；读取本地 paid</text><path d="M380,570 L380,623" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="630" width="610" height="115" rx="14" fill="#ffedd5" stroke="#94a3b8"/><text x="118" y="661" font-size="25" font-weight="bold">结论：再次调用可能重复</text><text x="118" y="696" font-size="25">若无远端去重，外部次数变成 2</text><text x="42" y="800" font-size="24">一次成功返回的推演没有覆盖中途崩溃。</text><text x="42" y="835" font-size="24">交换两次写入的顺序，也会留下遗漏窗口。</text></g></svg>