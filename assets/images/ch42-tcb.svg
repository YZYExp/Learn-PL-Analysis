<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><rect width="760" height="900" fill="#f8fafc"/><g fill="#18354e" font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="49" text-anchor="start" font-size="30">可信边界：证明项检查与实际运行</text><text x="34" y="91" text-anchor="start" font-size="24">每一层说明对象；绿色保证不能越过橙色边界</text><rect x="55" y="135" width="650" height="125" rx="18" fill="#ffeedb" stroke="#bb8245" stroke-width="2"/><text x="380" y="172" text-anchor="middle" font-size="27">① 定义证明对象</text><text x="380" y="213" text-anchor="middle" font-size="25">程序模型、规格及其与真实任务的对应</text><path d="M380 260 V286" stroke="#526f89" stroke-width="3"/><polygon points="380,299 373,285 387,285" fill="#526f89"/><rect x="55" y="300" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="337" text-anchor="middle" font-size="27">② 策略构造证明项</text><text x="380" y="378" text-anchor="middle" font-size="25">分类、重写、归纳与算术策略</text><path d="M380 425 V451" stroke="#526f89" stroke-width="3"/><polygon points="380,464 373,450 387,450" fill="#526f89"/><rect x="55" y="465" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="502" text-anchor="middle" font-size="27">③ 内核检查目标类型</text><text x="380" y="543" text-anchor="middle" font-size="25">确认指定定义与逻辑依赖下定理成立</text><path d="M380 590 V616" stroke="#526f89" stroke-width="3"/><polygon points="380,629 373,615 387,615" fill="#526f89"/><rect x="55" y="630" width="650" height="125" rx="18" fill="#ffeedb" stroke="#bb8245" stroke-width="2"/><text x="380" y="667" text-anchor="middle" font-size="27">④ 交付运行产物</text><text x="380" y="708" text-anchor="middle" font-size="25">源码版本、代码生成、编译、库与硬件</text><text x="34" y="846" text-anchor="start" font-size="24">检查 Lean 模型，不等于证明手工改写的 Python。</text></g></svg>