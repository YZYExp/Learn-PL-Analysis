<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img"><title>Gallina：沿有限列表递归</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#466782"/></marker></defs><rect width="760" height="900" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324e"><text x="32" y="49" font-size="30" font-weight="700">Gallina：沿有限列表递归</text><text x="32" y="91" font-size="24" fill="#526a80">A 为 accepted_count；S 表示自然数后继</text><rect x="32" y="130" width="696" height="130" rx="14" fill="#e3eefb" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="165" font-size="25" font-weight="700">1 输入：三个布尔条目</text><text x="52" y="199" font-size="25">A([true;false;true])</text><text x="52" y="233" font-size="25">true 分支：S(A([false;true]))</text><line x1="380" y1="264" x2="380" y2="292" stroke="#466782" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="300" width="696" height="130" rx="14" fill="#e3eefb" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="335" font-size="25" font-weight="700">2 进入尾部，处理 false</text><text x="52" y="369" font-size="25">A([false;true]) = A([true])</text><text x="52" y="403" font-size="25">这一项不增加计数</text><line x1="380" y1="434" x2="380" y2="462" stroke="#466782" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="470" width="696" height="130" rx="14" fill="#dff2eb" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="505" font-size="25" font-weight="700">3 再处理 true，随后遇到空表</text><text x="52" y="539" font-size="25">A([true]) = S(A([]))</text><text x="52" y="573" font-size="25">A([]) = 0</text><line x1="380" y1="604" x2="380" y2="632" stroke="#466782" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="640" width="696" height="150" rx="14" fill="#fff0dc" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="675" font-size="25" font-weight="700">4 代回原表达式</text><text x="52" y="709" font-size="25">S(A([false;true])) = S(S(0)) = 2</text><text x="52" y="743" font-size="25">每一步调用参数均为更短尾部</text><text x="52" y="777" font-size="25">这里只展示一个输入的计算</text><text x="32" y="877" font-size="24" fill="#526a80">完整上界性质还需对任意列表作归纳证明</text></g></svg>