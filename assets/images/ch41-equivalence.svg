<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><rect width="760" height="900" fill="#f8fafc"/><g fill="#18354e" font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="49" text-anchor="start" font-size="30">程序等价：先固定观察对象</text><text x="34" y="91" text-anchor="start" font-size="24">纯函数模型：Nat、总函数、无副作用</text><rect x="55" y="135" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="172" text-anchor="middle" font-size="27">① 变换输入</text><text x="380" y="213" text-anchor="middle" font-size="25">before(x) = (x+0)+1</text><path d="M380 260 V286" stroke="#526f89" stroke-width="3"/><polygon points="380,299 373,285 387,285" fill="#526f89"/><rect x="55" y="300" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="337" text-anchor="middle" font-size="27">② 改写并使用加零等式</text><text x="380" y="378" text-anchor="middle" font-size="25">x+0 = x；after(x) = x+1</text><path d="M380 425 V451" stroke="#526f89" stroke-width="3"/><polygon points="380,464 373,450 387,450" fill="#526f89"/><rect x="55" y="465" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="502" text-anchor="middle" font-size="27">③ 逐输入返回值相同</text><text x="380" y="543" text-anchor="middle" font-size="25">∀x，before(x) = after(x)</text><path d="M380 590 V616" stroke="#526f89" stroke-width="3"/><polygon points="380,629 373,615 387,615" fill="#526f89"/><rect x="55" y="630" width="650" height="125" rx="18" fill="#ffeedb" stroke="#bb8245" stroke-width="2"/><text x="380" y="667" text-anchor="middle" font-size="27">④ 不能直接推广到读取调用</text><text x="380" y="708" text-anchor="middle" font-size="25">read()+read() 与 2×read() 的读取次数不同</text><text x="34" y="846" text-anchor="start" font-size="24">返回值等价不自动证明时间、内存或事件轨迹相同。</text></g></svg>