<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><rect width="760" height="900" fill="#f8fafc"/><g fill="#18354e" font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="49" text-anchor="start" font-size="30">C 指针加一：数值与资源同时检查</text><text x="34" y="91" text-anchor="start" font-size="24">目标：*p 由 v 变 v+1；不是只检查 p 非空</text><rect x="55" y="135" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="169" text-anchor="middle" font-size="27">① 调用前提</text><text x="380" y="211" text-anchor="middle" font-size="25">0 ≤ v &lt; Int.max_unsigned</text><text x="380" y="245" text-anchor="middle" font-size="25">拥有 p 上已初始化、可写的 unsigned 对象</text><path d="M380 260 V286" stroke="#526f89" stroke-width="3"/><polygon points="380,299 373,285 387,285" fill="#526f89"/><rect x="55" y="300" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="334" text-anchor="middle" font-size="27">② 读取与计算</text><text x="380" y="376" text-anchor="middle" font-size="25">从资源推出读取合法</text><text x="380" y="410" text-anchor="middle" font-size="25">严格上界使机器加一对应数学 v+1</text><path d="M380 425 V451" stroke="#526f89" stroke-width="3"/><polygon points="380,464 373,450 387,450" fill="#526f89"/><rect x="55" y="465" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="499" text-anchor="middle" font-size="27">③ 写回并重建资源</text><text x="380" y="541" text-anchor="middle" font-size="25">data_at 中的旧值 v 更新为 v+1</text><text x="380" y="575" text-anchor="middle" font-size="25">其他独立资源不变</text><path d="M380 590 V616" stroke="#526f89" stroke-width="3"/><polygon points="380,629 373,615 387,615" fill="#526f89"/><rect x="55" y="630" width="650" height="125" rx="18" fill="#ffeedb" stroke="#bb8245" stroke-width="2"/><text x="380" y="664" text-anchor="middle" font-size="27">④ 结论边界</text><text x="380" y="706" text-anchor="middle" font-size="25">规格骨架用于讲解验证义务</text><text x="380" y="740" text-anchor="middle" font-size="25">本书没有运行此函数的 VST semax_body</text><text x="34" y="846" text-anchor="start" font-size="24">unsigned 回绕是定义行为；规格是否允许另行决定。</text></g></svg>