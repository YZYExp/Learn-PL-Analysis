<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#2563a6"/></marker></defs><rect width="760" height="900" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324d"><text x="32" y="47" font-size="30">容器分析：存在事实会被别名写入改变</text><text x="32" y="94" font-size="24">普通 Python dict；排除子类重载和并发修改</text><rect x="32" y="140" width="696" height="140" rx="14" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="56" y="177" font-size="28">① 输入：两个名字指同一容器</text><text x="56" y="222" font-size="26">orders = {&quot;A&quot;:100}；alias = orders</text><text x="56" y="260" font-size="26">同一对象 M：键 A 存在，值为 100</text><path d="M380,280 L380,312" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="320" width="696" height="140" rx="14" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="56" y="357" font-size="28">② 检查成员关系</text><text x="56" y="402" font-size="26">if &quot;A&quot; in orders：进入真分支</text><text x="56" y="440" font-size="26">此程序点可记录：A 必然属于 M</text><path d="M380,460 L380,492" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="500" width="696" height="140" rx="14" fill="#fff0df" stroke="#cc7628" stroke-width="2"/><text x="56" y="537" font-size="28">③ 经另一个名字修改 M</text><text x="56" y="582" font-size="26">alias.pop(&quot;A&quot;)</text><text x="56" y="620" font-size="26">M 的 A 已删除；旧的存在事实失效</text><path d="M380,640 L380,672" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="680" width="696" height="140" rx="14" fill="#e0f3ef" stroke="#218679" stroke-width="2"/><text x="56" y="717" font-size="28">④ 再次索引</text><text x="56" y="762" font-size="26">amount = orders[&quot;A&quot;]</text><text x="56" y="800" font-size="26">普通字典缺键：产生 KeyError</text><text x="32" y="873" font-size="24">修改作用到容器身份，不能仅更新变量名 alias。</text></g></svg>