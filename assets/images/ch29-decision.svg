<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="600" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="55" font-size="30" fill="#17324d" text-anchor="start">性能分析的证据顺序</text><text x="40" y="97" font-size="21" fill="#17324d" text-anchor="start">确定目标与边界，再逐步定位；优化后回到整体指标</text><rect x="60" y="145" width="390" height="95" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="255.0" y="184.5" font-size="23" fill="#17324d" text-anchor="middle">端到端目标</text><text x="255.0" y="216.5" font-size="23" fill="#17324d" text-anchor="middle">延迟、吞吐与输入规模</text><path d="M455 192 L528.0 192.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="540,192 528.0,186.0 528.0,198.0" fill="#2563eb"/><rect x="550" y="145" width="390" height="95" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="745.0" y="184.5" font-size="23" fill="#17324d" text-anchor="middle">整体时间线</text><text x="745.0" y="216.5" font-size="23" fill="#17324d" text-anchor="middle">计算、搬运、等待</text><path d="M745 245 L745.0 318.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="745,330 751.0,318.0 739.0,318.0" fill="#2563eb"/><rect x="550" y="340" width="390" height="95" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="745.0" y="379.5" font-size="23" fill="#17324d" text-anchor="middle">局部指标与对照实验</text><text x="745.0" y="411.5" font-size="23" fill="#17324d" text-anchor="middle">带宽、依赖、资源占用</text><path d="M545 388 L472.0 388.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="460,388 472.0,394.0 472.0,382.0" fill="#2563eb"/><rect x="60" y="340" width="390" height="95" rx="14" fill="#e7f5f2" stroke="#0f766e" stroke-width="2"/><text x="255.0" y="379.5" font-size="23" fill="#17324d" text-anchor="middle">复测与正确性检查</text><text x="255.0" y="411.5" font-size="23" fill="#17324d" text-anchor="middle">收益、误差与业务规格</text><text x="65" y="530" font-size="23" fill="#17324d" text-anchor="start">先提出可被推翻的瓶颈假设，再用测量决定是否保留优化。</text></g></svg>