<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2563eb"/></marker></defs><rect width="760" height="900" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#183153"><text x="42" y="45" font-size="30" font-weight="bold">合成与验证：让反例约束下一轮</text><text x="42" y="78" font-size="24">候选语法、规格与验证范围预先明确</text><rect x="95" y="105" width="610" height="115" rx="14" fill="#dbeafe" stroke="#94a3b8"/><text x="118" y="136" font-size="25" font-weight="bold">输入：规格 + 语法 + 已有例子</text><text x="118" y="171" font-size="25">明确哪些行为允许改变</text><path d="M380,220 L380,273" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="280" width="610" height="115" rx="14" fill="#dbeafe" stroke="#94a3b8"/><text x="118" y="311" font-size="25" font-weight="bold">候选生成</text><text x="118" y="346" font-size="25">选择满足当前例子的程序</text><path d="M380,395 L380,448" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="455" width="610" height="115" rx="14" fill="#ffedd5" stroke="#94a3b8"/><text x="118" y="486" font-size="25" font-weight="bold">独立验证：有反例则反馈生成</text><text x="118" y="521" font-size="25">反例加入例子，收缩候选集合</text><path d="M380,570 L380,623" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="630" width="610" height="115" rx="14" fill="#ccfbf1" stroke="#94a3b8"/><text x="118" y="661" font-size="25" font-weight="bold">若无反例或检查未决：说明范围</text><text x="118" y="696" font-size="25">证明成立 / 有限通过 / 未知要分开</text><path d="M95,510 L48,510 L48,335 L87,335" stroke="#d97706" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="42" y="800" font-size="24">橙色回路表示发现反例时返回生成步骤。</text><text x="42" y="835" font-size="24">超时和搜索耗尽都不能自动写成规格已证明。</text></g></svg>