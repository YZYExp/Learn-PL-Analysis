<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>退款接口的三种约束</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#426481"/></marker></defs><rect width="1000" height="600" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#16324f"><text x="40" y="51" font-size="29" font-weight="700">退款接口的三种约束</text><text x="40" y="87" font-size="20" fill="#50667d">教学接口草图；这些机制的具体语法随语言而异</text><rect x="35" y="135" width="300" height="260" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="55" y="170" font-size="24">类型</text><text x="55" y="204" font-size="24">OrderId 与 Money</text><text x="55" y="238" font-size="24">区分身份和金额</text><text x="55" y="272" font-size="24">Positive 需校验构造</text><text x="55" y="306" font-size="24">排除部分非法输入</text><rect x="350" y="135" width="300" height="260" rx="14" fill="#e1f3ed" stroke="#adc2d5"/><text x="370" y="170" font-size="24">效果</text><text x="370" y="204" font-size="24">Network / WriteDB</text><text x="370" y="238" font-size="24">Throw / Pure</text><text x="370" y="272" font-size="24">描述可能的影响</text><text x="370" y="306" font-size="24">检查隐含副作用</text><rect x="665" y="135" width="300" height="260" rx="14" fill="#fff0d9" stroke="#adc2d5"/><text x="685" y="170" font-size="24">所有权</text><text x="685" y="204" font-size="24">谁拥有资源？</text><text x="685" y="238" font-size="24">谁可以借用？</text><text x="685" y="272" font-size="24">何时结束访问？</text><text x="685" y="306" font-size="24">约束访问与释放</text><rect x="80" y="450" width="840" height="85" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="100" y="485" font-size="24">三者仍需连接：数据库约束、并发控制与外部服务协议</text></g></svg>