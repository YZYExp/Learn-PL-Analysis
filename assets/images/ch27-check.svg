<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="600" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="55" font-size="30" fill="#17324d" text-anchor="start">比较候选解释：无符号最小值与带符号最小值</text><text x="40" y="97" font-size="21" fill="#17324d" text-anchor="start">同一组位模式，在不同解释下可能得到不同结果</text><rect x="60" y="155" width="880" height="80" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="500.0" y="203.0" font-size="23" fill="#17324d" text-anchor="middle">输入位模式：a = 2⁶⁴ − 1，b = 1</text><path d="M330 240 L259.6 292.8" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="250,300 263.20000000000005,297.6 256.0,288.0" fill="#2563eb"/><path d="M670 240 L740.4 292.8" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="750,300 744.0,288.0 736.8,297.6" fill="#2563eb"/><rect x="60" y="310" width="390" height="115" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="255.0" y="359.5" font-size="23" fill="#17324d" text-anchor="middle">无符号解释</text><text x="255.0" y="391.5" font-size="23" fill="#17324d" text-anchor="middle">a 很大，输出 b = 1</text><rect x="550" y="310" width="390" height="115" rx="14" fill="#fff2df" stroke="#c76a19" stroke-width="2"/><text x="745.0" y="359.5" font-size="23" fill="#17324d" text-anchor="middle">带符号解释</text><text x="745.0" y="391.5" font-size="23" fill="#17324d" text-anchor="middle">a = −1，输出 a</text><text x="70" y="510" font-size="22" fill="#17324d" text-anchor="start">边界输入能推翻错误类型推断；有限测试不能证明全域等价。</text></g></svg>