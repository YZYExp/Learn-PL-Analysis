<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img"><title>从“不能重复”走向可检查规格</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#486a87"/></marker></defs><rect width="760" height="900" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324e"><text x="36" y="51" font-size="30" font-weight="700">从“不能重复”走向可检查规格</text><text x="36" y="91" font-size="24" fill="#50677e">顺序原子账本；暂不模拟网络与崩溃</text><rect x="40" y="130" width="680" height="130" rx="15" fill="#e4eefb" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="165" font-size="25" font-weight="700">1 先选含义</text><text x="62" y="198" font-size="25">同一请求键至多累计一次金额</text><text x="62" y="231" font-size="25">其他合法键仍可继续部分退款</text><line x1="380" y1="265" x2="380" y2="292" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="300" width="680" height="130" rx="15" fill="#e4eefb" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="335" font-size="25" font-weight="700">2 明确状态</text><text x="62" y="368" font-size="25">p：已支付；r：累计退款</text><text x="62" y="401" font-size="25">Done：已完成请求键集合</text><line x1="380" y1="435" x2="380" y2="462" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="470" width="680" height="130" rx="15" fill="#dff2ec" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="505" font-size="25" font-weight="700">3 写出允许动作</text><text x="62" y="538" font-size="25">新键：0 &lt; n 且 r+n ≤ p 才接受</text><text x="62" y="571" font-size="25">重复键：r 与 Done 均保持不变</text><line x1="380" y1="605" x2="380" y2="632" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="640" width="680" height="150" rx="15" fill="#fff0dc" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="675" font-size="25" font-weight="700">4 提出待证性质</text><text x="62" y="708" font-size="25">初态满足 0 ≤ r ≤ p</text><text x="62" y="741" font-size="25">每个允许动作都保持该不变量</text><text x="62" y="774" font-size="25">外部支付效果需要另建模型</text><text x="40" y="877" font-size="24" fill="#50677e">原创精确图解 · 从业务选择到状态关系</text></g></svg>