<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#2563a6"/></marker></defs><rect width="760" height="900" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324d"><text x="32" y="47" font-size="30">框架规则：把未触及的资源带过去</text><text x="32" y="94" font-size="24">顺序模型；声明的访问与变量修改边界必须成立</text><rect x="32" y="140" width="696" height="140" rx="14" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="56" y="177" font-size="28">① 局部规格</text><text x="56" y="222" font-size="26">{ list(p) 且 p ≠ null } pop_head(p)</text><text x="56" y="260" font-size="26">正常返回 q，并得到 list(q)</text><path d="M380,280 L380,312" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="320" width="696" height="140" rx="14" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="56" y="357" font-size="28">② 扩大输入：加入独立资源</text><text x="56" y="402" font-size="26">输入：list(p) * r ↦ 7</text><text x="56" y="440" font-size="26">另有 p ≠ null；R 定义为 r ↦ 7</text><path d="M380,460 L380,492" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="500" width="696" height="140" rx="14" fill="#fff0df" stroke="#cc7628" stroke-width="2"/><text x="56" y="537" font-size="28">③ 检查框架规则的前提</text><text x="56" y="582" font-size="26">操作满足局部性，不访问 R 的资源</text><text x="56" y="620" font-size="26">修改的程序变量不出现在 R 的自由变量中</text><path d="M380,640 L380,672" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="680" width="696" height="140" rx="14" fill="#e0f3ef" stroke="#218679" stroke-width="2"/><text x="56" y="717" font-size="28">④ 组合后置条件</text><text x="56" y="762" font-size="26">输出：list(q) * r ↦ 7</text><text x="56" y="800" font-size="26">头节点被释放；r 单元保持原值</text><text x="32" y="873" font-size="24">指针变量同名与否，不能代替资源分离证明。</text></g></svg>