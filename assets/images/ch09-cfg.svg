<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#2563a6"/></marker><marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#cc7628"/></marker></defs><rect width="1000" height="620" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324d"><text x="40" y="47" font-size="28" fill="#17324d">CFG：循环头、回边与提前返回</text><text x="40" y="82" font-size="21" fill="#17324d">A 初始化；H 是循环头；B、C 是循环内部块</text><path d="M500,165 L500,220" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><path d="M500,290 L500,355" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><path d="M350,255 L230,255" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><path d="M350,390 L230,390" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><path d="M500,430 L500,495" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><path d="M650,530 L850,530 L850,255 L650,255" fill="none" stroke="#cc7628" stroke-width="3" marker-end="url(#orange)"/><rect x="350" y="110" width="300" height="55" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="367" y="141" font-size="22" fill="#17324d">A：total=0；i=0</text><rect x="350" y="220" width="300" height="70" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="367" y="251" font-size="22" fill="#17324d">H：i &lt; count ?</text><rect x="350" y="355" width="300" height="75" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="367" y="386" font-size="22" fill="#17324d">B：累加；超限？</text><rect x="350" y="495" width="300" height="70" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="367" y="526" font-size="22" fill="#17324d">C：i=i+1</text><rect x="40" y="220" width="190" height="70" rx="12" fill="#e0f3ef" stroke="#218679" stroke-width="2"/><text x="57" y="251" font-size="22" fill="#17324d">E：返回 total</text><rect x="40" y="355" width="190" height="75" rx="12" fill="#e0f3ef" stroke="#218679" stroke-width="2"/><text x="57" y="386" font-size="22" fill="#17324d">L：返回 limit</text><text x="515" y="330" font-size="21" fill="#17324d">真</text><text x="270" y="245" font-size="21" fill="#17324d">假</text><text x="270" y="380" font-size="21" fill="#17324d">真</text><text x="515" y="472" font-size="21" fill="#17324d">假</text><text x="865" y="380" font-size="21" fill="#a75c20">回边</text></g></svg>