<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="600" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#183153"><text x="45" y="52" font-size="28" font-weight="bold">评估流程：真值、运行与裁决分离</text><path d="M300,165 L375,165" stroke="#2563eb" stroke-width="3" marker-end="url(#a)" fill="none"/><path d="M625,165 L700,165" stroke="#2563eb" stroke-width="3" marker-end="url(#a)" fill="none"/><path d="M485,220 L325,325" stroke="#2563eb" stroke-width="3" marker-end="url(#a)" fill="none"/><path d="M825,220 L695,325" stroke="#2563eb" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="50" y="110" width="250" height="110" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="175.0" y="145" text-anchor="middle" font-size="22">固定数据与真值</text><text x="175.0" y="176" text-anchor="middle" font-size="22">根因 / 版本 / 范围</text><rect x="375" y="110" width="250" height="110" rx="12" fill="#ccfbf1" stroke="#94a3b8"/><text x="500.0" y="145" text-anchor="middle" font-size="22">统一预算运行</text><text x="500.0" y="176" text-anchor="middle" font-size="22">时间 / 内存 / 成本</text><rect x="700" y="110" width="250" height="110" rx="12" fill="#ffedd5" stroke="#94a3b8"/><text x="825.0" y="145" text-anchor="middle" font-size="22">独立复核候选</text><text x="825.0" y="176" text-anchor="middle" font-size="22">正确 / 错误 / 未决</text><rect x="185" y="325" width="280" height="110" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="325.0" y="360" text-anchor="middle" font-size="22">运行状态</text><text x="325.0" y="391" text-anchor="middle" font-size="22">成功 / 超时 / 提取失败</text><rect x="555" y="325" width="280" height="110" rx="12" fill="#ccfbf1" stroke="#94a3b8"/><text x="695.0" y="360" text-anchor="middle" font-size="22">效果与代价</text><text x="695.0" y="391" text-anchor="middle" font-size="22">检出 / 误报 / 人工时间</text><text x="45" y="510" font-size="21">未标注候选不自动等于误报；失败运行不等于干净项目。</text><text x="45" y="542" font-size="21">先冻结根因归并、测试集与预算，再比较不同系统。</text></g></svg>