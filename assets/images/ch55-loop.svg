<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><rect width="760" height="900" fill="#f8fafc"/><g fill="#18354e" font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="49" text-anchor="start" font-size="30">数组循环：不变量连接每次读取</text><text x="34" y="91" text-anchor="start" font-size="24">概括官方 sumarray：机器结果可按模求和</text><rect x="55" y="135" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="169" text-anchor="middle" font-size="27">① 初始化</text><text x="380" y="211" text-anchor="middle" font-size="25">i = 0，s = 0</text><text x="380" y="245" text-anchor="middle" font-size="25">数组资源描述原始内容</text><path d="M380 260 V286" stroke="#526f89" stroke-width="3"/><polygon points="380,299 373,285 387,285" fill="#526f89"/><rect x="55" y="300" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="334" text-anchor="middle" font-size="27">② 循环头与分支</text><text x="380" y="376" text-anchor="middle" font-size="25">0 ≤ i ≤ n；若 i &lt; n，推出读取范围</text><text x="380" y="410" text-anchor="middle" font-size="25">s 对应前 i 项和的机器表示</text><path d="M380 425 V451" stroke="#526f89" stroke-width="3"/><polygon points="380,464 373,450 387,450" fill="#526f89"/><rect x="55" y="465" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="499" text-anchor="middle" font-size="27">③ 保持不变量</text><text x="380" y="541" text-anchor="middle" font-size="25">读取 a[i]，更新 s，再令 i := i+1</text><text x="380" y="575" text-anchor="middle" font-size="25">证明新前缀和、计数范围与数组资源</text><path d="M380 590 V616" stroke="#526f89" stroke-width="3"/><polygon points="380,629 373,615 387,615" fill="#526f89"/><rect x="55" y="630" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="664" text-anchor="middle" font-size="27">④ 循环退出</text><text x="380" y="706" text-anchor="middle" font-size="25">由 i ≤ n 与 i ≥ n 得 i = n</text><text x="380" y="740" text-anchor="middle" font-size="25">前缀变成全数组；资源完整交还</text><text x="34" y="846" text-anchor="start" font-size="24">地址权限、类型范围与累加语义都在证明责任中。</text></g></svg>