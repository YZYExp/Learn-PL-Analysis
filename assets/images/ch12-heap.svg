<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#2563a6"/></marker><marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#cc7628"/></marker></defs><rect width="1000" height="620" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324d"><text x="40" y="47" font-size="28" fill="#17324d">引用、对象身份与字段值</text><text x="40" y="82" font-size="21" fill="#17324d">第 4 行 b.amount=0 后：a.amount 为 0，c.amount 为 100</text><path d="M245,165 L620,235" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><path d="M245,295 L620,265" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><path d="M245,460 L620,460" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#blue)"/><rect x="75" y="125" width="170" height="75" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="92" y="156" font-size="22" fill="#17324d">引用 a</text><rect x="75" y="255" width="170" height="75" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="92" y="286" font-size="22" fill="#17324d">引用 b</text><rect x="75" y="420" width="170" height="75" rx="12" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="92" y="451" font-size="22" fill="#17324d">引用 c</text><rect x="620" y="180" width="290" height="145" rx="12" fill="#fff0df" stroke="#cc7628" stroke-width="2"/><text x="637" y="211" font-size="22" fill="#17324d">对象 O1</text><text x="637" y="240" font-size="22" fill="#17324d">amount：100 → 0</text><text x="637" y="269" font-size="22" fill="#17324d">由第 1 行创建</text><rect x="620" y="395" width="290" height="115" rx="12" fill="#e0f3ef" stroke="#218679" stroke-width="2"/><text x="637" y="426" font-size="22" fill="#17324d">对象 O2</text><text x="637" y="455" font-size="22" fill="#17324d">amount：100</text><text x="637" y="484" font-size="22" fill="#17324d">由第 3 行创建</text><text x="40" y="585" font-size="21" fill="#17324d">a 与 b 共享对象身份；相同字段初值不代表 O1 与 O2 是同一对象。</text></g></svg>