<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><rect width="760" height="900" fill="#f8fafc"/><g fill="#18354e" font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="49" text-anchor="start" font-size="30">金额守恒：把前提接到结论</text><text x="34" y="91" text-anchor="start" font-size="24">模型：自然数整数分；减法结果小于零时截断</text><rect x="55" y="135" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="172" text-anchor="middle" font-size="27">① 输入与契约</text><text x="380" y="213" text-anchor="middle" font-size="25">paid、amount ∈ Nat；amount ≤ paid</text><path d="M380 260 V286" stroke="#526f89" stroke-width="3"/><polygon points="380,299 373,285 387,285" fill="#526f89"/><rect x="55" y="300" width="650" height="125" rx="18" fill="#e3efff" stroke="#497bad" stroke-width="2"/><text x="380" y="337" text-anchor="middle" font-size="27">② 定义剩余金额</text><text x="380" y="378" text-anchor="middle" font-size="25">remaining = paid − amount</text><path d="M380 425 V451" stroke="#526f89" stroke-width="3"/><polygon points="380,464 373,450 387,450" fill="#526f89"/><rect x="55" y="465" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="502" text-anchor="middle" font-size="27">③ 应用带前提的减法引理</text><text x="380" y="543" text-anchor="middle" font-size="25">(paid − amount) + amount = paid</text><path d="M380 590 V616" stroke="#526f89" stroke-width="3"/><polygon points="380,629 373,615 387,615" fill="#526f89"/><rect x="55" y="630" width="650" height="125" rx="18" fill="#dcf3ea" stroke="#448d78" stroke-width="2"/><text x="380" y="667" text-anchor="middle" font-size="27">④ 结论与边界</text><text x="380" y="708" text-anchor="middle" font-size="25">守恒成立；不包含并发与外部支付效果</text><text x="34" y="846" text-anchor="start" font-size="24">越界反例：paid=100，amount=200，则 0+200≠100。</text></g></svg>