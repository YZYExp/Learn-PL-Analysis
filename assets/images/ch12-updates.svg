<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#2563a6"/></marker></defs><rect width="1000" height="620" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324d"><text x="40" y="47" font-size="28">同一条写入，身份信息决定更新方式</text><text x="40" y="82" font-size="21">初始两个对象的 amount 都为 100；执行 x.amount = 0</text><rect x="40" y="120" width="440" height="395" rx="12" fill="#e0f3ef" stroke="#218679" stroke-width="2"/><rect x="520" y="120" width="440" height="395" rx="12" fill="#fff0df" stroke="#cc7628" stroke-width="2"/><text x="65" y="160" font-size="25">强更新：确认唯一具体位置</text><text x="545" y="160" font-size="25">弱更新：可能写两个位置之一</text><text x="65" y="215" font-size="23">x 只指向一个具体对象 O1</text><text x="545" y="215" font-size="23">x 可能指向 O1，也可能 O2</text><path d="M260,245 L260,305" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><path d="M740,245 L740,305" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><text x="65" y="350" font-size="24">O1.amount = 0</text><text x="65" y="400" font-size="24">O2.amount = 100</text><text x="545" y="350" font-size="24">O1.amount ∈ {0, 100}</text><text x="545" y="400" font-size="24">O2.amount ∈ {0, 100}</text><text x="65" y="465" font-size="22">目标旧值可被覆盖</text><text x="545" y="465" font-size="22">每个候选都需保留旧值</text><text x="40" y="565" font-size="22">右侧没有表示两个对象必然同时改变；它概括两种可能执行。</text><text x="40" y="600" font-size="21">只有一个抽象目标仍可能是摘要对象，不足以单独授权强更新。</text></g></svg>