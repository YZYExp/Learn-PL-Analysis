<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img"><title>同一个上界，不同的证据路线</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#466782"/></marker></defs><rect width="760" height="900" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324e"><text x="32" y="49" font-size="30" font-weight="700">同一个上界，不同的证据路线</text><text x="32" y="91" font-size="24" fill="#526a80">a 为尾部接受数，m 为长度；下列为证明分支</text><rect x="32" y="130" width="696" height="130" rx="14" fill="#e3eefb" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="165" font-size="25" font-weight="700">1 对齐对象与归纳假设</text><text x="52" y="199" font-size="25">有限布尔列表；自然数计数</text><text x="52" y="233" font-size="25">非空分支已有 IH : a ≤ m</text><line x1="380" y1="264" x2="380" y2="292" stroke="#466782" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="300" width="696" height="130" rx="14" fill="#dff2eb" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="335" font-size="25" font-weight="700">2 空列表分支</text><text x="52" y="369" font-size="25">计数为 0，长度也为 0</text><text x="52" y="403" font-size="25">两边均使用自然数不等式自反性</text><line x1="380" y1="434" x2="380" y2="462" stroke="#466782" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="470" width="696" height="150" rx="14" fill="#e3eefb" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="505" font-size="25" font-weight="700">3 头部为 true</text><text x="52" y="539" font-size="25">目标：S a ≤ S m</text><text x="52" y="573" font-size="25">Lean：Nat.succ_le_succ</text><text x="52" y="607" font-size="25">Rocq：le_n_S</text><line x1="380" y1="624" x2="380" y2="632" stroke="#466782" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="640" width="696" height="170" rx="14" fill="#fff0dc" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="675" font-size="25" font-weight="700">4 头部为 false</text><text x="52" y="709" font-size="25">目标：a ≤ S m</text><text x="52" y="743" font-size="25">Lean：a ≤ m 与 m ≤ S m 的传递性</text><text x="52" y="777" font-size="25">Rocq：le_S 直接扩展右侧上界</text><text x="32" y="877" font-size="24" fill="#526a80">先比较数学目标，再核对各自引理的类型</text></g></svg>