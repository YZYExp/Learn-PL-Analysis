<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img"><title>样例计算怎样连接到一般证明</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#486a87"/></marker></defs><rect width="760" height="900" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324e"><text x="36" y="51" font-size="30" font-weight="700">样例计算怎样连接到一般证明</text><text x="36" y="91" font-size="24" fill="#50677e">每一步的对象和覆盖范围不同</text><rect x="40" y="130" width="680" height="130" rx="15" fill="#e4eefb" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="165" font-size="25" font-weight="700">1 计算一个输入</text><text x="62" y="198" font-size="25">acceptedCount [true,false,true] = 2</text><text x="62" y="231" font-size="25">只覆盖这一份具体列表</text><line x1="380" y1="265" x2="380" y2="292" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="300" width="680" height="130" rx="15" fill="#e4eefb" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="335" font-size="25" font-weight="700">2 陈述一般目标</text><text x="62" y="368" font-size="25">对任意有限布尔列表 xs</text><text x="62" y="401" font-size="25">接受条目数 ≤ xs.length</text><line x1="380" y1="435" x2="380" y2="462" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="470" width="680" height="130" rx="15" fill="#dff2ec" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="505" font-size="25" font-weight="700">3 构造归纳证明</text><text x="62" y="538" font-size="25">空表成立；对尾部假设成立</text><text x="62" y="571" font-size="25">再覆盖 true 与 false 两种头元素</text><line x1="380" y1="605" x2="380" y2="632" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="640" width="680" height="150" rx="15" fill="#fff0dc" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="675" font-size="25" font-weight="700">4 检查证明项</text><text x="62" y="708" font-size="25">策略负责帮助构造论证</text><text x="62" y="741" font-size="25">内核检查其是否符合形式规则</text><text x="62" y="774" font-size="25">实际业务含义仍需审查定义</text><text x="40" y="877" font-size="24" fill="#50677e">样例结果不能自行升级为全称定理</text></g></svg>