<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="600" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="55" font-size="30" fill="#17324d" text-anchor="start">一段无符号退款减法：参数到结果</text><text x="40" y="97" font-size="21" fill="#17324d" text-anchor="start">前提：paid ≥ refund；采用 AAPCS64 基础整数传参规则</text><rect x="45" y="155" width="260" height="105" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="175.0" y="199.5" font-size="23" fill="#17324d" text-anchor="middle">输入 x0 = 10000</text><text x="175.0" y="231.5" font-size="23" fill="#17324d" text-anchor="middle">输入 x1 = 2500</text><path d="M305 208 L353.0 208.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="365,208 353.0,202.0 353.0,214.0" fill="#2563eb"/><rect x="375" y="155" width="250" height="105" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="500.0" y="199.5" font-size="23" fill="#17324d" text-anchor="middle">sub x0, x0, x1</text><text x="500.0" y="231.5" font-size="23" fill="#17324d" text-anchor="middle">x0 = 7500</text><path d="M625 208 L673.0 208.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="685,208 673.0,202.0 673.0,214.0" fill="#2563eb"/><rect x="695" y="155" width="260" height="105" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="825.0" y="199.5" font-size="23" fill="#17324d" text-anchor="middle">ret</text><text x="825.0" y="231.5" font-size="23" fill="#17324d" text-anchor="middle">调用者接收 x0</text><rect x="90" y="350" width="820" height="115" rx="14" fill="#e7f5f2" stroke="#0f766e" stroke-width="2"/><text x="500.0" y="399.5" font-size="23" fill="#17324d" text-anchor="middle">寄存器状态发生变化；同一个 x0 承载了输入和输出</text><text x="500.0" y="431.5" font-size="23" fill="#17324d" text-anchor="middle">这段机器运算本身不检查业务上的退款资格</text><text x="90" y="530" font-size="24" fill="#17324d" text-anchor="start">按状态转换理解指令，再检查业务规格与调用前提。</text></g></svg>