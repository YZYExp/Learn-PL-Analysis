<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>别名：同一对象与相同初值不是一回事</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#426481"/></marker></defs><rect width="1000" height="600" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#16324f"><text x="40" y="51" font-size="29" font-weight="700">别名：同一对象与相同初值不是一回事</text><text x="40" y="87" font-size="20" fill="#50667d">执行 b[&quot;state&quot;] = &quot;refunded&quot; 后的引用关系</text><rect x="50" y="150" width="200" height="75" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="70" y="185" font-size="24">a</text><rect x="50" y="280" width="200" height="75" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="70" y="315" font-size="24">b</text><rect x="50" y="430" width="200" height="75" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="70" y="465" font-size="24">c</text><rect x="470" y="180" width="450" height="150" rx="14" fill="#e1f3ed" stroke="#adc2d5"/><text x="490" y="215" font-size="24">对象 O1</text><text x="490" y="249" font-size="24">state = refunded</text><text x="490" y="283" font-size="24">a 与 b 访问同一字典</text><rect x="470" y="415" width="450" height="105" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="490" y="450" font-size="24">对象 O2</text><text x="490" y="484" font-size="24">state = paid</text><line x1="250" y1="188" x2="470" y2="220" stroke="#426481" stroke-width="3" marker-end="url(#arrow)"/><line x1="250" y1="318" x2="470" y2="285" stroke="#426481" stroke-width="3" marker-end="url(#arrow)"/><line x1="250" y1="468" x2="470" y2="468" stroke="#426481" stroke-width="3" marker-end="url(#arrow)"/></g></svg>