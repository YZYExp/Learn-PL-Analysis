<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="600" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="55" font-size="30" fill="#17324d" text-anchor="start">2 个 block × 4 个线程，处理 6 个元素</text><text x="40" y="97" font-size="21" fill="#17324d" text-anchor="start">索引 i = blockIdx.x × blockDim.x + threadIdx.x</text><text x="55" y="155" font-size="24" fill="#17324d" text-anchor="start">block 0</text><text x="55" y="305" font-size="24" fill="#17324d" text-anchor="start">block 1</text><rect x="195" y="120" width="160" height="90" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="275.0" y="173.0" font-size="23" fill="#17324d" text-anchor="middle">t0 → i=0</text><rect x="380" y="120" width="160" height="90" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="460.0" y="173.0" font-size="23" fill="#17324d" text-anchor="middle">t1 → i=1</text><rect x="565" y="120" width="160" height="90" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="645.0" y="173.0" font-size="23" fill="#17324d" text-anchor="middle">t2 → i=2</text><rect x="750" y="120" width="160" height="90" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="830.0" y="173.0" font-size="23" fill="#17324d" text-anchor="middle">t3 → i=3</text><rect x="195" y="270" width="160" height="90" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="275.0" y="323.0" font-size="23" fill="#17324d" text-anchor="middle">t0 → i=4</text><rect x="380" y="270" width="160" height="90" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="460.0" y="323.0" font-size="23" fill="#17324d" text-anchor="middle">t1 → i=5</text><rect x="565" y="270" width="160" height="90" rx="14" fill="#fff2df" stroke="#c76a19" stroke-width="2"/><text x="645.0" y="323.0" font-size="23" fill="#17324d" text-anchor="middle">t2 → i=6</text><rect x="750" y="270" width="160" height="90" rx="14" fill="#fff2df" stroke="#c76a19" stroke-width="2"/><text x="830.0" y="323.0" font-size="23" fill="#17324d" text-anchor="middle">t3 → i=7</text><rect x="80" y="465" width="840" height="70" rx="14" fill="#e7f5f2" stroke="#0f766e" stroke-width="2"/><text x="500.0" y="508.0" font-size="23" fill="#17324d" text-anchor="middle">有效元素 0–5：执行读写；尾部索引 6、7：跳过</text></g></svg>