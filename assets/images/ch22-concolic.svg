<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D6480"/></marker></defs><rect width="1000" height="600" fill="#FAFCFF"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#16324F">
<text x="45" y="55" font-size="30" font-weight="bold">Concolic：翻转一次执行的路径前缀</text>
<text x="45" y="94" font-size="21">原输入 a = 200；依次判断 a &gt; 0、a ≤ 1000</text>
<rect x="55" y="155" width="890" height="80" rx="12" fill="#E5EFFF" stroke="#BCCDE0"/>
<text x="500.0" y="203.0" font-size="22" fill="#16324F" text-anchor="middle">原轨迹：a &gt; 0 为真 → a ≤ 1000 为真</text>
<rect x="55" y="330" width="410" height="130" rx="12" fill="#DDF3EE" stroke="#BCCDE0"/>
<text x="260.0" y="372.0" font-size="22" fill="#16324F" text-anchor="middle">翻转第二个条件</text>
<text x="260.0" y="403.0" font-size="22" fill="#16324F" text-anchor="middle">a &gt; 0 且 a &gt; 1000</text>
<text x="260.0" y="434.0" font-size="22" fill="#16324F" text-anchor="middle">候选输入：1001</text>
<rect x="535" y="330" width="410" height="130" rx="12" fill="#FFF0D9" stroke="#BCCDE0"/>
<text x="740.0" y="372.0" font-size="22" fill="#16324F" text-anchor="middle">翻转第一个条件</text>
<text x="740.0" y="403.0" font-size="22" fill="#16324F" text-anchor="middle">a ≤ 0</text>
<text x="740.0" y="434.0" font-size="22" fill="#16324F" text-anchor="middle">后续旧条件不再保留</text>
<path d="M320,235 L260,330" fill="none" stroke="#4D6480" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M680,235 L740,330" fill="none" stroke="#4D6480" stroke-width="2.5" marker-end="url(#a)"/>
<text x="45" y="561" font-size="20" fill="#16324F" text-anchor="start">求解得到的是候选输入；交回真实执行检查路径与环境是否吻合。</text>
</g></svg>