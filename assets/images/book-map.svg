<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1536" viewBox="0 0 760 1536"><rect width="760" height="1536" fill="#f6f8fb"/><g font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif" fill="#17334d"><text x="35" y="55" font-size="30" font-weight="bold">全书地图：程序行为、证据与证明</text><text x="35" y="96" font-size="23">51章沿纵向主线阅读，也可按导读选路。</text><rect x="35" y="125" width="690" height="132" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="125" width="8" height="132" rx="4" fill="#247a82"/><text x="60" y="162" font-size="24" fill="#247a82">第1篇 · 01—06章</text><text x="60" y="200" font-size="26" font-weight="bold">语言与行为</text><text x="60" y="235" font-size="22">先说明行为、规格与模型边界</text><rect x="35" y="279" width="690" height="132" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="279" width="8" height="132" rx="4" fill="#bd733d"/><text x="60" y="316" font-size="24" fill="#247a82">第2篇 · 07—12章</text><text x="60" y="354" font-size="26" font-weight="bold">程序表示</text><text x="60" y="389" font-size="22">把程序转成可操作的结构</text><rect x="35" y="433" width="690" height="132" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="433" width="8" height="132" rx="4" fill="#247a82"/><text x="60" y="470" font-size="24" fill="#247a82">第3篇 · 13—18章</text><text x="60" y="508" font-size="26" font-weight="bold">静态推理</text><text x="60" y="543" font-size="22">用近似、摘要与查询计算性质</text><rect x="35" y="587" width="690" height="132" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="587" width="8" height="132" rx="4" fill="#bd733d"/><text x="60" y="624" font-size="24" fill="#247a82">第4篇 · 19—24章</text><text x="60" y="662" font-size="26" font-weight="bold">动态与验证</text><text x="60" y="697" font-size="22">把执行、约束与验证联系起来</text><rect x="35" y="741" width="690" height="132" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="741" width="8" height="132" rx="4" fill="#247a82"/><text x="60" y="778" font-size="24" fill="#247a82">第5篇 · 25—30章</text><text x="60" y="816" font-size="26" font-weight="bold">形式化规格与机器检查证明</text><text x="60" y="851" font-size="22">表达规格，构造并检查证明</text><rect x="35" y="895" width="690" height="132" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="895" width="8" height="132" rx="4" fill="#bd733d"/><text x="60" y="932" font-size="24" fill="#247a82">第6篇 · 31—36章</text><text x="60" y="970" font-size="26" font-weight="bold">机器与异构</text><text x="60" y="1005" font-size="22">落到CPU/GPU、内存与机器执行</text><rect x="35" y="1049" width="690" height="132" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="1049" width="8" height="132" rx="4" fill="#247a82"/><text x="60" y="1086" font-size="24" fill="#247a82">第7篇 · 37—41章</text><text x="60" y="1124" font-size="26" font-weight="bold">数据、内存与资源的深入推理</text><text x="60" y="1159" font-size="22">深入堆、字符串、资源、信息流与浮点</text><rect x="35" y="1203" width="690" height="132" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="1203" width="8" height="132" rx="4" fill="#bd733d"/><text x="60" y="1240" font-size="24" fill="#247a82">第8篇 · 42—45章</text><text x="60" y="1278" font-size="26" font-weight="bold">分析细化与工程闭环</text><text x="60" y="1313" font-size="22">由反例、故障和变更推动验证闭环</text><rect x="35" y="1357" width="690" height="132" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="1357" width="8" height="132" rx="4" fill="#247a82"/><text x="60" y="1394" font-size="24" fill="#247a82">第9篇 · 46—51章</text><text x="60" y="1432" font-size="26" font-weight="bold">应用与构建</text><text x="60" y="1467" font-size="22">组合工具、AI证据、评估与实际实现</text></g></svg>