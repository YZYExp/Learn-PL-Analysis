<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880"><rect width="1100" height="880" fill="#f6f8fb"/><g font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif" fill="#17334d"><text x="50" y="60" font-size="30" font-weight="bold">全书地图：围绕程序行为建立联系</text><text x="50" y="100" font-size="21">阅读顺序向下；每篇都回答“行为、证据、假设与边界”</text><rect x="50" y="135" width="1000" height="94" rx="12" fill="white" stroke="#bdcddd"/><rect x="50" y="135" width="8" height="94" rx="4" fill="#247a82"/><text x="78" y="170" font-size="24" font-weight="bold">01—06 语言与行为</text><text x="390" y="170" font-size="22">语言语义 · 类型 · 对象 · 运行时</text><text x="390" y="205" font-size="20" fill="#4c6477">先定义行为与希望成立的性质</text><rect x="50" y="247" width="1000" height="94" rx="12" fill="white" stroke="#bdcddd"/><rect x="50" y="247" width="8" height="94" rx="4" fill="#bd733d"/><text x="78" y="282" font-size="24" font-weight="bold">07—12 程序表示</text><text x="390" y="282" font-size="22">AST · SSA · CFG · 调用图 · 堆</text><text x="390" y="317" font-size="20" fill="#4c6477">把程序转成可操作的结构</text><rect x="50" y="359" width="1000" height="94" rx="12" fill="white" stroke="#bdcddd"/><rect x="50" y="359" width="8" height="94" rx="4" fill="#247a82"/><text x="78" y="394" font-size="24" font-weight="bold">13—18 静态推理</text><text x="390" y="394" font-size="22">数据流 · 抽象解释 · 摘要 · 查询</text><text x="390" y="429" font-size="20" fill="#4c6477">在明确模型中计算近似结论</text><rect x="50" y="471" width="1000" height="94" rx="12" fill="white" stroke="#bdcddd"/><rect x="50" y="471" width="8" height="94" rx="4" fill="#bd733d"/><text x="78" y="506" font-size="24" font-weight="bold">19—24 动态与验证</text><text x="390" y="506" font-size="22">轨迹 · 符号执行 · 混合分析 · 验证</text><text x="390" y="541" font-size="20" fill="#4c6477">用执行与约束补充行为证据</text><rect x="50" y="583" width="1000" height="94" rx="12" fill="white" stroke="#bdcddd"/><rect x="50" y="583" width="8" height="94" rx="4" fill="#247a82"/><text x="78" y="618" font-size="24" font-weight="bold">25—30 机器与异构</text><text x="390" y="618" font-size="22">CPU · 内存模型 · 逆向 · GPU</text><text x="390" y="653" font-size="20" fill="#4c6477">理解抽象如何落到机器执行</text><rect x="50" y="695" width="1000" height="94" rx="12" fill="white" stroke="#bdcddd"/><rect x="50" y="695" width="8" height="94" rx="4" fill="#bd733d"/><text x="78" y="730" font-size="24" font-weight="bold">31—36 应用与构建</text><text x="390" y="730" font-size="22">规格 · 工具 · AI · 评估 · 实现</text><text x="390" y="765" font-size="20" fill="#4c6477">将方法组装成可验证的分析系统</text><text x="50" y="845" font-size="20">范围：程序行为与分析；相邻领域按它们对行为、模型和证据的影响展开。</text></g></svg>