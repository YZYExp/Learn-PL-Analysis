<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><rect width="760" height="900" fill="#f6f8fb"/><g font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif"><text x="35" y="48" font-size="30" fill="#17334d" font-weight="bold">全书地图：程序行为、证据与证明</text><text x="35" y="90" font-size="24" fill="#17334d" font-weight="normal">55章纵向主线；数字为展示章号</text><rect x="35" y="113" width="690" height="74" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="113" width="8" height="74" rx="4" fill="#247a82"/><text x="59" y="142" font-size="25" fill="#17334d" font-weight="bold">01 · 01—06  语言与行为</text><text x="59" y="173" font-size="24" fill="#41617b" font-weight="normal">行为、规格、类型与运行时</text><rect x="35" y="198" width="690" height="74" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="198" width="8" height="74" rx="4" fill="#bd733d"/><text x="59" y="227" font-size="25" fill="#17334d" font-weight="bold">02 · 07—12  程序表示</text><text x="59" y="258" font-size="24" fill="#41617b" font-weight="normal">AST、IR、控制流、依赖与别名</text><rect x="35" y="283" width="690" height="74" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="283" width="8" height="74" rx="4" fill="#247a82"/><text x="59" y="312" font-size="25" fill="#17334d" font-weight="bold">03 · 13—18  静态推理</text><text x="59" y="343" font-size="24" fill="#41617b" font-weight="normal">数据流、抽象、摘要与查询</text><rect x="35" y="368" width="690" height="74" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="368" width="8" height="74" rx="4" fill="#bd733d"/><text x="59" y="397" font-size="25" fill="#17334d" font-weight="bold">04 · 19—24  动态与验证</text><text x="59" y="428" font-size="24" fill="#41617b" font-weight="normal">执行、符号路径、并发与验证</text><rect x="35" y="453" width="690" height="74" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="453" width="8" height="74" rx="4" fill="#247a82"/><text x="59" y="482" font-size="25" fill="#17334d" font-weight="bold">05 · 25—34  形式化规格与证明</text><text x="59" y="513" font-size="24" fill="#41617b" font-weight="normal">Lean / Rocq、CompCert 与 VST</text><rect x="35" y="538" width="690" height="74" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="538" width="8" height="74" rx="4" fill="#bd733d"/><text x="59" y="567" font-size="25" fill="#17334d" font-weight="bold">06 · 35—40  机器与异构</text><text x="59" y="598" font-size="24" fill="#41617b" font-weight="normal">CPU / GPU、内存、逆向与性能</text><rect x="35" y="623" width="690" height="74" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="623" width="8" height="74" rx="4" fill="#247a82"/><text x="59" y="652" font-size="25" fill="#17334d" font-weight="bold">07 · 41—45  数据、内存与资源推理</text><text x="59" y="683" font-size="24" fill="#41617b" font-weight="normal">堆、字符串、资源、信息流与浮点</text><rect x="35" y="708" width="690" height="74" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="708" width="8" height="74" rx="4" fill="#bd733d"/><text x="59" y="737" font-size="25" fill="#17334d" font-weight="bold">08 · 46—49  分析细化与工程闭环</text><text x="59" y="768" font-size="24" fill="#41617b" font-weight="normal">反例、恢复、增量与修复闭环</text><rect x="35" y="793" width="690" height="74" rx="12" fill="white" stroke="#bdcddd"/><rect x="35" y="793" width="8" height="74" rx="4" fill="#247a82"/><text x="59" y="822" font-size="25" fill="#17334d" font-weight="bold">09 · 50—55  应用与构建</text><text x="59" y="853" font-size="24" fill="#41617b" font-weight="normal">工具、AI证据、评估与实际实现</text></g></svg>