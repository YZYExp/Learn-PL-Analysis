<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#486d8a"/></marker></defs><rect width="1000" height="650" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17334d"><text x="42" y="48" font-size="28" text-anchor="start" fill="#17334d">文件类型不变，合法操作随状态变化</text><rect x="45" y="130" width="240" height="85" rx="14" fill="#ffebd3" stroke="#9db8ca" stroke-width="1.5"/><text x="165.0" y="180.2" font-size="22" text-anchor="middle" fill="#17334d">Failed</text><rect x="380" y="130" width="240" height="85" rx="14" fill="#d9f3eb" stroke="#9db8ca" stroke-width="1.5"/><text x="500.0" y="180.2" font-size="22" text-anchor="middle" fill="#17334d">Open</text><rect x="715" y="130" width="240" height="85" rx="14" fill="#dcecff" stroke="#9db8ca" stroke-width="1.5"/><text x="835.0" y="180.2" font-size="22" text-anchor="middle" fill="#17334d">Closed</text><line x1="620" y1="172" x2="715" y2="172" stroke="#486d8a" stroke-width="2.5"/><polygon points="715,172 703.0,177.0 703.0,167.0" fill="#486d8a"/><text x="645" y="147" font-size="20" text-anchor="start" fill="#17334d">close</text><path d="M455 130 V87 H585 V130" fill="none" stroke="#486d8a" stroke-width="2.5" marker-end="url(#a)"/><text x="492" y="80" font-size="20" text-anchor="start" fill="#17334d">read</text><rect x="715" y="295" width="240" height="85" rx="14" fill="#ffebd3" stroke="#9db8ca" stroke-width="1.5"/><text x="835.0" y="345.2" font-size="22" text-anchor="middle" fill="#17334d">Error</text><line x1="835" y1="215" x2="835" y2="295" stroke="#486d8a" stroke-width="2.5"/><polygon points="835,295 830.0,283.0 840.0,283.0" fill="#486d8a"/><text x="850" y="263" font-size="20" text-anchor="start" fill="#17334d">read / close</text><text x="45" y="280" font-size="22" text-anchor="start" fill="#17334d">open 成功 → Open</text><text x="45" y="325" font-size="22" text-anchor="start" fill="#17334d">open 失败 → Failed</text><rect x="45" y="460" width="380" height="110" rx="14" fill="#dcecff" stroke="#9db8ca" stroke-width="1.5"/><text x="235.0" y="506.7" font-size="22" text-anchor="middle" fill="#17334d">skip 为真：{Closed}</text><text x="235.0" y="538.7" font-size="22" text-anchor="middle" fill="#17334d">skip 为假：{Open}</text><rect x="530" y="460" width="425" height="110" rx="14" fill="#ffebd3" stroke="#9db8ca" stroke-width="1.5"/><text x="742.5" y="506.7" font-size="22" text-anchor="middle" fill="#17334d">汇合：{Open,Closed}</text><text x="742.5" y="538.7" font-size="22" text-anchor="middle" fill="#17334d">read 必须报告可能错误</text><line x1="425" y1="515" x2="530" y2="515" stroke="#486d8a" stroke-width="2.5"/><polygon points="530,515 518.0,520.0 518.0,510.0" fill="#486d8a"/><text x="45" y="625" font-size="22" text-anchor="start" fill="#17334d">本图采用自定义协议：重复 close 被禁止。</text></g></svg>