<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><rect width="760" height="900" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="55" font-size="31" fill="#1b3552" text-anchor="start">模拟关系：状态不同，观察对应</text><text x="32" y="100" font-size="24" fill="#1b3552" text-anchor="start">简化前向义务；不要求源代码与目标逐行相同</text><text x="180" y="165" font-size="27" fill="#1b3552" text-anchor="middle">源状态</text><text x="580" y="165" font-size="27" fill="#1b3552" text-anchor="middle">目标状态</text><rect x="40" y="195" width="280" height="110" rx="16" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="241.0" font-size="26" fill="#1b3552" text-anchor="middle">s：尚有内部计算</text><text x="180.0" y="279.0" font-size="26" fill="#1b3552" text-anchor="middle">如 x + 0</text><rect x="440" y="195" width="280" height="110" rx="16" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="580.0" y="241.0" font-size="26" fill="#1b3552" text-anchor="middle">t：可使用 x</text><text x="580.0" y="279.0" font-size="26" fill="#1b3552" text-anchor="middle">表示可能不同</text><text x="380" y="258" font-size="30" fill="#0f766e" text-anchor="middle">R</text><path d="M324 250 L343.0 250.0" fill="none" stroke="#0f766e" stroke-width="3"/><polygon points="357,250 343.0,243.0 343.0,257.0" fill="#0f766e"/><path d="M403 250 L422.0 250.0" fill="none" stroke="#0f766e" stroke-width="3"/><polygon points="436,250 422.0,243.0 422.0,257.0" fill="#0f766e"/><path d="M180 312 L180.0 426.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="180,440 187.0,426.0 173.0,426.0" fill="#2563eb"/><path d="M580 312 L580.0 426.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="580,440 587.0,426.0 573.0,426.0" fill="#2563eb"/><text x="205" y="380" font-size="25" fill="#1b3552" text-anchor="start">一步</text><text x="600" y="380" font-size="24" fill="#1b3552" text-anchor="start">零步或多步</text><rect x="40" y="450" width="280" height="110" rx="16" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="496.0" font-size="26" fill="#1b3552" text-anchor="middle">s′：值为 x</text><text x="180.0" y="534.0" font-size="26" fill="#1b3552" text-anchor="middle">事件轨迹 τ</text><rect x="440" y="450" width="280" height="110" rx="16" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="580.0" y="496.0" font-size="26" fill="#1b3552" text-anchor="middle">t′：对应结果</text><text x="580.0" y="534.0" font-size="26" fill="#1b3552" text-anchor="middle">相同轨迹 τ</text><text x="380" y="515" font-size="30" fill="#0f766e" text-anchor="middle">R′</text><path d="M324 505 L343.0 505.0" fill="none" stroke="#0f766e" stroke-width="3"/><polygon points="357,505 343.0,498.0 343.0,512.0" fill="#0f766e"/><path d="M403 505 L422.0 505.0" fill="none" stroke="#0f766e" stroke-width="3"/><polygon points="436,505 422.0,498.0 422.0,512.0" fill="#0f766e"/><rect x="50" y="625" width="660" height="115" rx="16" fill="#e8f6f2" stroke="#0f766e" stroke-width="2"/><text x="380.0" y="673.5" font-size="26" fill="#1b3552" text-anchor="middle">责任一：初始状态与最终结果匹配</text><text x="380.0" y="711.5" font-size="26" fill="#1b3552" text-anchor="middle">责任二：每次对应执行保持观察</text><rect x="50" y="775" width="660" height="85" rx="16" fill="#fff3e2" stroke="#b96519" stroke-width="2"/><text x="380.0" y="827.5" font-size="26" fill="#1b3552" text-anchor="middle">允许停顿时，仍须排除无限假空转</text></g></svg>