<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>一份可信报告要保留四层边界</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#426481"/></marker></defs><rect width="1000" height="600" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#16324f"><text x="40" y="51" font-size="29" font-weight="700">一份可信报告要保留四层边界</text><text x="40" y="87" font-size="20" fill="#50667d">原创精确图解 · 蓝：程序信息　青：满足条件　橙：需要关注</text><rect x="40" y="125" width="205" height="80" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="60" y="160" font-size="24">规格</text><rect x="270" y="125" width="690" height="80" rx="14" fill="#e1f3ed" stroke="#adc2d5"/><text x="290" y="160" font-size="24">要证明：累计退款不超额</text><text x="290" y="194" font-size="24">合法输入是什么？</text><rect x="40" y="230" width="205" height="80" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="60" y="265" font-size="24">环境模型</text><rect x="270" y="230" width="690" height="80" rx="14" fill="#fff0d9" stroke="#adc2d5"/><text x="290" y="265" font-size="24">事务、支付服务与并发规则</text><text x="290" y="299" font-size="24">哪些假设被省略？</text><rect x="40" y="335" width="205" height="80" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="60" y="370" font-size="24">算法覆盖</text><rect x="270" y="335" width="690" height="80" rx="14" fill="#e1f3ed" stroke="#adc2d5"/><text x="290" y="370" font-size="24">路径预算、库模型与超时</text><text x="290" y="404" font-size="24">哪些结果仍未知？</text><rect x="40" y="440" width="205" height="80" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="60" y="475" font-size="24">运行证据</text><rect x="270" y="440" width="690" height="80" rx="14" fill="#fff0d9" stroke="#adc2d5"/><text x="290" y="475" font-size="24">输入、版本、配置与轨迹</text><text x="290" y="509" font-size="24">候选能否被复现？</text></g></svg>