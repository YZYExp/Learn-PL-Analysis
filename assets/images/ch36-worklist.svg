<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="600" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#183153"><text x="45" y="52" font-size="28" font-weight="bold">分支与汇合中的常量传播</text><path d="M420,170 L240,235" stroke="#2563eb" stroke-width="3" marker-end="url(#a)" fill="none"/><text x="338.0" y="192.5" font-size="20">true</text><path d="M580,170 L760,235" stroke="#2563eb" stroke-width="3" marker-end="url(#a)" fill="none"/><text x="678.0" y="192.5" font-size="20">false</text><path d="M270,320 L420,375" stroke="#2563eb" stroke-width="3" marker-end="url(#a)" fill="none"/><path d="M730,320 L580,375" stroke="#2563eb" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="365" y="90" width="270" height="80" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="500.0" y="125" text-anchor="middle" font-size="22">paid_cents = 100</text><rect x="80" y="235" width="270" height="85" rx="12" fill="#ccfbf1" stroke="#94a3b8"/><text x="215.0" y="270" text-anchor="middle" font-size="22">count = 1</text><rect x="650" y="235" width="270" height="85" rx="12" fill="#ffedd5" stroke="#94a3b8"/><text x="785.0" y="270" text-anchor="middle" font-size="22">count = 0</text><rect x="365" y="375" width="270" height="85" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="500.0" y="410" text-anchor="middle" font-size="22">cost: count = ?</text><text x="45" y="510" font-size="21">join(1, 0) = ?；? 表示未知整数，整体 null 才表示不可达。</text><text x="45" y="542" font-size="21">最终状态不能证明分母非零，因此输出候选而非可行路径证明。</text></g></svg>