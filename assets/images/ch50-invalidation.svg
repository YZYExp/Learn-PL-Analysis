<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2563eb"/></marker></defs><rect width="760" height="900" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#183153"><text x="42" y="45" font-size="30" font-weight="bold">摘要失效：变化沿消费者传播</text><text x="42" y="78" font-size="24">箭头表示输入影响使用者</text><rect x="95" y="105" width="610" height="115" rx="14" fill="#ffedd5" stroke="#94a3b8"/><text x="118" y="136" font-size="25" font-weight="bold">输入发生变化</text><text x="118" y="171" font-size="25">gateway-model：去重契约改变</text><path d="M380,220 L380,273" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="280" width="610" height="115" rx="14" fill="#dbeafe" stroke="#94a3b8"/><text x="118" y="311" font-size="25" font-weight="bold">直接依赖的摘要过期</text><text x="118" y="346" font-size="25">refund-summary：需重新计算</text><path d="M380,395 L380,448" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="455" width="610" height="115" rx="14" fill="#dbeafe" stroke="#94a3b8"/><text x="118" y="486" font-size="25" font-weight="bold">间接消费者也需要检查</text><text x="118" y="521" font-size="25">handler-summary → report</text><path d="M380,570 L380,623" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="630" width="610" height="115" rx="14" fill="#ccfbf1" stroke="#94a3b8"/><text x="118" y="661" font-size="25" font-weight="bold">结论：失效集合是消费者闭包</text><text x="118" y="696" font-size="25">无依赖路径的 unrelated 可保留</text><text x="42" y="800" font-size="24">源码哈希相同，不表示外部语义模型相同。</text><text x="42" y="835" font-size="24">教学实现求闭包；不负责真实摘要重算。</text></g></svg>