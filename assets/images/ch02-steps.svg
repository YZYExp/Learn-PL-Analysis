<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>小步推演：每一步都说明改变什么</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#426481"/></marker></defs><rect width="1000" height="600" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#16324f"><text x="40" y="51" font-size="29" font-weight="700">小步推演：每一步都说明改变什么</text><text x="40" y="87" font-size="20" fill="#50667d">教学模型：数学整数；顺序执行；本图不包含外部服务</text><rect x="40" y="125" width="120" height="70" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="60" y="160" font-size="24">S0</text><rect x="190" y="125" width="465" height="70" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="210" y="160" font-size="24">paid=10000，already=3000</text><rect x="685" y="125" width="275" height="70" rx="14" fill="#e1f3ed" stroke="#adc2d5"/><text x="705" y="160" font-size="24">request=2000</text><line x1="100" y1="195" x2="100" y2="221" stroke="#426481" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="225" width="120" height="70" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="60" y="260" font-size="24">S1</text><rect x="190" y="225" width="465" height="70" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="210" y="260" font-size="24">remaining := paid - already</text><rect x="685" y="225" width="275" height="70" rx="14" fill="#e1f3ed" stroke="#adc2d5"/><text x="705" y="260" font-size="24">remaining=7000</text><line x1="100" y1="295" x2="100" y2="321" stroke="#426481" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="325" width="120" height="70" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="60" y="360" font-size="24">S2</text><rect x="190" y="325" width="465" height="70" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="210" y="360" font-size="24">request &lt;= remaining 为真</text><rect x="685" y="325" width="275" height="70" rx="14" fill="#e1f3ed" stroke="#adc2d5"/><text x="705" y="360" font-size="24">选择 then 分支</text><line x1="100" y1="395" x2="100" y2="421" stroke="#426481" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="425" width="120" height="70" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="60" y="460" font-size="24">S3</text><rect x="190" y="425" width="465" height="70" rx="14" fill="#e4eefb" stroke="#adc2d5"/><text x="210" y="460" font-size="24">already := already + request</text><rect x="685" y="425" width="275" height="70" rx="14" fill="#e1f3ed" stroke="#adc2d5"/><text x="705" y="460" font-size="24">already=5000</text></g></svg>