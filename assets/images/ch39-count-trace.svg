<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img"><title>接受计数：从列表到结果</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#486a87"/></marker></defs><rect width="760" height="900" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324e"><text x="36" y="51" font-size="30" font-weight="700">接受计数：从列表到结果</text><text x="36" y="91" font-size="24" fill="#50677e">记 A 为 acceptedCount，1+ 表示后继</text><rect x="40" y="125" width="680" height="110" rx="15" fill="#e4eefb" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="160" font-size="25" font-weight="700">1 A([true,false,true])</text><text x="62" y="193" font-size="25">= 1 + A([false,true])</text><line x1="380" y1="240" x2="380" y2="262" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="270" width="680" height="110" rx="15" fill="#e4eefb" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="305" font-size="25" font-weight="700">2 A([false,true])</text><text x="62" y="338" font-size="25">= A([true])</text><line x1="380" y1="385" x2="380" y2="407" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="415" width="680" height="110" rx="15" fill="#e4eefb" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="450" font-size="25" font-weight="700">3 A([true])</text><text x="62" y="483" font-size="25">= 1 + A([])</text><line x1="380" y1="530" x2="380" y2="552" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="560" width="680" height="110" rx="15" fill="#dff2ec" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="595" font-size="25" font-weight="700">4 A([])</text><text x="62" y="628" font-size="25">= 0</text><line x1="380" y1="675" x2="380" y2="697" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="705" width="680" height="120" rx="15" fill="#fff0dc" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="740" font-size="25" font-weight="700">5 从尾部向上代回</text><text x="62" y="773" font-size="25">A([true,false,true]) = 1 + 1 = 2</text><text x="62" y="806" font-size="25">递归参数始终是更短的尾列表</text><text x="40" y="877" font-size="24" fill="#50677e">原创精确图解 · 具体计算不是全称证明</text></g></svg>