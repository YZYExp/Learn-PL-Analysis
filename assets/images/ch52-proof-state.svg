<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img"><title>Rocq：上下文与证明目标</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#466782"/></marker></defs><rect width="760" height="900" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324e"><text x="32" y="49" font-size="30" font-weight="700">Rocq：上下文与证明目标</text><text x="32" y="91" font-size="24" fill="#526a80">示例为任意命题的合取交换</text><rect x="32" y="130" width="696" height="130" rx="14" fill="#e3eefb" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="165" font-size="25" font-weight="700">1 声明定理</text><text x="52" y="199" font-size="25">P、Q : Prop</text><text x="52" y="233" font-size="25">目标：P ∧ Q → Q ∧ P</text><line x1="380" y1="264" x2="380" y2="292" stroke="#466782" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="300" width="696" height="130" rx="14" fill="#e3eefb" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="335" font-size="25" font-weight="700">2 intros [hp hq]</text><text x="52" y="369" font-size="25">局部证据：hp : P，hq : Q</text><text x="52" y="403" font-size="25">当前目标：Q ∧ P</text><line x1="380" y1="434" x2="380" y2="462" stroke="#466782" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="470" width="696" height="130" rx="14" fill="#dff2eb" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="505" font-size="25" font-weight="700">3 split</text><text x="52" y="539" font-size="25">第一个子目标 Q：exact hq</text><text x="52" y="573" font-size="25">第二个子目标 P：exact hp</text><line x1="380" y1="604" x2="380" y2="632" stroke="#466782" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="640" width="696" height="150" rx="14" fill="#fff0dc" stroke="#a7bfd3" stroke-width="2"/><text x="52" y="675" font-size="25" font-weight="700">4 Qed</text><text x="52" y="709" font-size="25">两个子目标全部完成</text><text x="52" y="743" font-size="25">保存的证明仍须符合内核规则</text><text x="52" y="777" font-size="25">它不声称业务中的 P、Q 已成立</text><text x="32" y="877" font-size="24" fill="#526a80">策略改变证明状态，最终检查的是证明项</text></g></svg>