<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img"><title>合取交换：一步步构造证据</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#486a87"/></marker></defs><rect width="760" height="900" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324e"><text x="36" y="51" font-size="30" font-weight="700">合取交换：一步步构造证据</text><text x="36" y="91" font-size="24" fill="#50677e">P、Q 是任意命题，不先断言它们成立</text><rect x="40" y="130" width="680" height="130" rx="15" fill="#e4eefb" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="165" font-size="25" font-weight="700">1 初始目标</text><text x="62" y="198" font-size="25">⊢ P ∧ Q → Q ∧ P</text><text x="62" y="231" font-size="25">需要：把输入证据变成输出证据</text><line x1="380" y1="265" x2="380" y2="292" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="300" width="680" height="130" rx="15" fill="#e4eefb" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="335" font-size="25" font-weight="700">2 执行 intro h</text><text x="62" y="368" font-size="25">已知 h : P ∧ Q</text><text x="62" y="401" font-size="25">目标 ⊢ Q ∧ P</text><line x1="380" y1="435" x2="380" y2="462" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="470" width="680" height="130" rx="15" fill="#dff2ec" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="505" font-size="25" font-weight="700">3 执行 constructor</text><text x="62" y="538" font-size="25">目标一 ⊢ Q：由 h.2 提供</text><text x="62" y="571" font-size="25">目标二 ⊢ P：由 h.1 提供</text><line x1="380" y1="605" x2="380" y2="632" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="640" width="680" height="150" rx="15" fill="#fff0dc" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="675" font-size="25" font-weight="700">4 两个子目标均完成</text><text x="62" y="708" font-size="25">组合所得证据具有类型 Q ∧ P</text><text x="62" y="741" font-size="25">整体证明具有类型 P ∧ Q → Q ∧ P</text><text x="62" y="774" font-size="25">仍未证明业务中的 P 或 Q 已成立</text><text x="40" y="877" font-size="24" fill="#50677e">原创精确图解 · 上下文与目标必须分清</text></g></svg>