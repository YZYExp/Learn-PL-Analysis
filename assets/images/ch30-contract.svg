<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="600" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="55" font-size="30" fill="#17324d" text-anchor="start">外部缓冲区：地址之外，还有生命周期合同</text><text x="40" y="97" font-size="21" fill="#17324d" text-anchor="start">make_blob 成功后由调用者负责；使用匹配的 free_blob 释放</text><rect x="60" y="155" width="250" height="95" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="185.0" y="194.5" font-size="23" fill="#17324d" text-anchor="middle">尚未创建</text><text x="185.0" y="226.5" font-size="23" fill="#17324d" text-anchor="middle">不得读取</text><path d="M315 200 L353.0 200.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="365,200 353.0,194.0 353.0,206.0" fill="#2563eb"/><rect x="375" y="155" width="250" height="95" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="500.0" y="194.5" font-size="23" fill="#17324d" text-anchor="middle">创建成功</text><text x="500.0" y="226.5" font-size="23" fill="#17324d" text-anchor="middle">p 指向 len 字节</text><path d="M630 200 L668.0 200.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="680,200 668.0,194.0 668.0,206.0" fill="#2563eb"/><rect x="690" y="155" width="250" height="95" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="815.0" y="194.5" font-size="23" fill="#17324d" text-anchor="middle">复制到上层对象</text><text x="815.0" y="226.5" font-size="23" fill="#17324d" text-anchor="middle">拥有独立存储</text><path d="M815 255 L815.0 328.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="815,340 821.0,328.0 809.0,328.0" fill="#2563eb"/><rect x="550" y="350" width="390" height="95" rx="14" fill="#fff2df" stroke="#c76a19" stroke-width="2"/><text x="745.0" y="389.5" font-size="23" fill="#17324d" text-anchor="middle">释放外部内存</text><text x="745.0" y="421.5" font-size="23" fill="#17324d" text-anchor="middle">原地址不得继续使用</text><rect x="60" y="350" width="390" height="95" rx="14" fill="#e7f5f2" stroke="#0f766e" stroke-width="2"/><text x="255.0" y="389.5" font-size="23" fill="#17324d" text-anchor="middle">失败：NULL、长度 0</text><text x="255.0" y="421.5" font-size="23" fill="#17324d" text-anchor="middle">不进入成功使用路径</text><text x="75" y="530" font-size="24" fill="#17324d" text-anchor="start">若返回零拷贝视图，就必须让底层存储活得足够久。</text></g></svg>