<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img"><title>归纳：为何能覆盖任意有限列表</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#486a87"/></marker></defs><rect width="760" height="900" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324e"><text x="36" y="51" font-size="30" font-weight="700">归纳：为何能覆盖任意有限列表</text><text x="36" y="91" font-size="24" fill="#50677e">A 为接受数，L 为列表长度</text><rect x="40" y="125" width="680" height="130" rx="15" fill="#e4eefb" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="160" font-size="25" font-weight="700">1 目标</text><text x="62" y="193" font-size="25">对任意 xs，证明 A(xs) ≤ L(xs)</text><text x="62" y="226" font-size="25">按列表结构归纳</text><line x1="380" y1="260" x2="380" y2="287" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="295" width="680" height="130" rx="15" fill="#dff2ec" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="330" font-size="25" font-weight="700">2 空表分支</text><text x="62" y="363" font-size="25">A([]) = 0，L([]) = 0</text><text x="62" y="396" font-size="25">用 Nat.le_refl 0 证明 0 ≤ 0</text><line x1="380" y1="430" x2="380" y2="457" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="465" width="680" height="130" rx="15" fill="#e4eefb" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="500" font-size="25" font-weight="700">3 非空表的归纳假设</text><text x="62" y="533" font-size="25">尾部 xs 已有 ih : A(xs) ≤ L(xs)</text><text x="62" y="566" font-size="25">接下来只对头元素 b 分类</text><line x1="380" y1="600" x2="380" y2="627" stroke="#486a87" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="635" width="680" height="175" rx="15" fill="#fff0dc" stroke="#a7bfd3" stroke-width="2"/><text x="62" y="670" font-size="25" font-weight="700">4 覆盖两种头元素</text><text x="62" y="703" font-size="25">false：A(xs) ≤ L(xs) ≤ L(xs)+1</text><text x="62" y="736" font-size="25">使用不等式传递性</text><text x="62" y="769" font-size="25">true：两边同加一，使用后继单调性</text><text x="40" y="877" font-size="24" fill="#50677e">归纳假设只用于更小尾部，不能假定当前目标</text></g></svg>