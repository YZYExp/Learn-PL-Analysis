<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#486d8a"/></marker></defs><rect width="1000" height="620" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17334d"><text x="42" y="48" font-size="28" text-anchor="start" fill="#17334d">保留分支身份，避免创造虚假变量组合</text><rect x="45" y="100" width="400" height="85" rx="14" fill="#dcecff" stroke="#9db8ca" stroke-width="1.5"/><text x="245.0" y="134.2" font-size="22" text-anchor="middle" fill="#17334d">路径 A：(refund,retained)</text><text x="245.0" y="166.2" font-size="22" text-anchor="middle" fill="#17334d">= (10000,0)</text><rect x="555" y="100" width="400" height="85" rx="14" fill="#ffebd3" stroke="#9db8ca" stroke-width="1.5"/><text x="755.0" y="134.2" font-size="22" text-anchor="middle" fill="#17334d">路径 B：(refund,retained)</text><text x="755.0" y="166.2" font-size="22" text-anchor="middle" fill="#17334d">= (0,10000)</text><rect x="45" y="290" width="400" height="90" rx="14" fill="#dcecff" stroke="#9db8ca" stroke-width="1.5"/><text x="245.0" y="326.7" font-size="22" text-anchor="middle" fill="#17334d">提前合并独立区间</text><text x="245.0" y="358.7" font-size="22" text-anchor="middle" fill="#17334d">两变量都为 [0,10000]</text><rect x="555" y="290" width="400" height="90" rx="14" fill="#d9f3eb" stroke="#9db8ca" stroke-width="1.5"/><text x="755.0" y="326.7" font-size="22" text-anchor="middle" fill="#17334d">分别计算 sum</text><text x="755.0" y="358.7" font-size="22" text-anchor="middle" fill="#17334d">A=10000；B=10000</text><line x1="245" y1="185" x2="245" y2="290" stroke="#486d8a" stroke-width="2.5"/><polygon points="245,290 240.0,278.0 250.0,278.0" fill="#486d8a"/><line x1="755" y1="185" x2="755" y2="290" stroke="#486d8a" stroke-width="2.5"/><polygon points="755,290 750.0,278.0 760.0,278.0" fill="#486d8a"/><path d="M755 185 V235 H445 V290" fill="none" stroke="#486d8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M245 185 V225 H555 V290" fill="none" stroke="#486d8a" stroke-width="2.5" marker-end="url(#a)"/><rect x="45" y="465" width="400" height="90" rx="14" fill="#ffebd3" stroke="#9db8ca" stroke-width="1.5"/><text x="245.0" y="501.7" font-size="22" text-anchor="middle" fill="#17334d">再相加：[0,20000]</text><text x="245.0" y="533.7" font-size="22" text-anchor="middle" fill="#17334d">不能证明 sum=10000</text><rect x="555" y="465" width="400" height="90" rx="14" fill="#d9f3eb" stroke="#9db8ca" stroke-width="1.5"/><text x="755.0" y="501.7" font-size="22" text-anchor="middle" fill="#17334d">最后合并：{10000}</text><text x="755.0" y="533.7" font-size="22" text-anchor="middle" fill="#17334d">可证明 sum=10000</text><line x1="245" y1="380" x2="245" y2="465" stroke="#486d8a" stroke-width="2.5"/><polygon points="245,465 240.0,453.0 250.0,453.0" fill="#486d8a"/><line x1="755" y1="380" x2="755" y2="465" stroke="#486d8a" stroke-width="2.5"/><polygon points="755,465 750.0,453.0 760.0,453.0" fill="#486d8a"/></g></svg>