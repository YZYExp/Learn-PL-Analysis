<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 Z" fill="#2563a6"/></marker></defs><rect width="760" height="900" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#17324d"><text x="32" y="47" font-size="30">终止性：剩余工作量不能无限下降</text><text x="32" y="94" font-size="24">示例 n=3；证明前提：数学整数、循环体会返回</text><rect x="32" y="140" width="696" height="140" rx="14" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="56" y="177" font-size="28">① 输入与不变量</text><text x="56" y="222" font-size="26">i=0；0 ≤ i ≤ n；n=3</text><text x="56" y="260" font-size="26">排名函数 V=n-i，初始为 3</text><path d="M380,280 L380,312" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="320" width="696" height="140" rx="14" fill="#e5effc" stroke="#2563a6" stroke-width="2"/><text x="56" y="357" font-size="28">② 一轮循环：i 增加 1</text><text x="56" y="402" font-size="26">i：0 → 1；V：3 → 2</text><text x="56" y="440" font-size="26">条件 i&lt;n 为真时，V 为正自然数</text><path d="M380,460 L380,492" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="500" width="696" height="140" rx="14" fill="#fff0df" stroke="#cc7628" stroke-width="2"/><text x="56" y="537" font-size="28">③ 后续已完成的迭代</text><text x="56" y="582" font-size="26">i：1 → 2 → 3；V：2 → 1 → 0</text><text x="56" y="620" font-size="26">每次正常完成循环体，V 严格减少</text><path d="M380,640 L380,672" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="680" width="696" height="140" rx="14" fill="#e0f3ef" stroke="#218679" stroke-width="2"/><text x="56" y="717" font-size="28">④ 到达退出条件</text><text x="56" y="762" font-size="26">i=n，条件 i&lt;n 为假</text><text x="56" y="800" font-size="26">自然数中不存在无限严格下降链</text><text x="32" y="873" font-size="24">若 process 永不返回，循环排名不能证明整体完成。</text></g></svg>