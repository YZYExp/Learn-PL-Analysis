<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="600" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="55" font-size="30" fill="#17324d" text-anchor="start">动态目标：明确部署集合，或保留未知行为</text><text x="40" y="97" font-size="21" fill="#17324d" text-anchor="start">一次轨迹中的已加载集合，不等于未来所有可能目标</text><rect x="60" y="155" width="390" height="105" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="255.0" y="199.5" font-size="23" fill="#17324d" text-anchor="middle">封闭部署假设</text><text x="255.0" y="231.5" font-size="23" fill="#17324d" text-anchor="middle">已知插件 A、B 与版本</text><rect x="550" y="155" width="390" height="105" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="745.0" y="199.5" font-size="23" fill="#17324d" text-anchor="middle">开放目标集合</text><text x="745.0" y="231.5" font-size="23" fill="#17324d" text-anchor="middle">A、B，以及未知插件</text><path d="M255 265 L255.0 333.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="255,345 261.0,333.0 249.0,333.0" fill="#2563eb"/><path d="M745 265 L745.0 333.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="745,345 751.0,333.0 739.0,333.0" fill="#2563eb"/><rect x="60" y="355" width="390" height="105" rx="14" fill="#e7f5f2" stroke="#0f766e" stroke-width="2"/><text x="255.0" y="399.5" font-size="23" fill="#17324d" text-anchor="middle">分析所有约定目标</text><text x="255.0" y="431.5" font-size="23" fill="#17324d" text-anchor="middle">结论依赖该部署清单</text><rect x="550" y="355" width="390" height="105" rx="14" fill="#fff2df" stroke="#c76a19" stroke-width="2"/><text x="745.0" y="399.5" font-size="23" fill="#17324d" text-anchor="middle">保守摘要与边界报告</text><text x="745.0" y="431.5" font-size="23" fill="#17324d" text-anchor="middle">不能直接删除未知调用</text><text x="75" y="545" font-size="23" fill="#17324d" text-anchor="start">回调、反射与 JIT 都需要记录目标身份和有关假设。</text></g></svg>