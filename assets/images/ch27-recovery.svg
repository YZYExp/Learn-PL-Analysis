<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="600" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="55" font-size="30" fill="#17324d" text-anchor="start">从二进制恢复结构：证据逐层累积</text><text x="40" y="97" font-size="21" fill="#17324d" text-anchor="start">每一步都可能含有未解决的边界，应保留不确定性</text><rect x="40" y="155" width="270" height="95" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="175.0" y="194.5" font-size="23" fill="#17324d" text-anchor="middle">文件与装载布局</text><text x="175.0" y="226.5" font-size="23" fill="#17324d" text-anchor="middle">架构、入口、节区</text><path d="M315 200 L348.0 200.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="360,200 348.0,194.0 348.0,206.0" fill="#2563eb"/><rect x="370" y="155" width="270" height="95" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="505.0" y="194.5" font-size="23" fill="#17324d" text-anchor="middle">反汇编</text><text x="505.0" y="226.5" font-size="23" fill="#17324d" text-anchor="middle">指令与基本块</text><path d="M645 200 L678.0 200.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="690,200 678.0,194.0 678.0,206.0" fill="#2563eb"/><rect x="700" y="155" width="260" height="95" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="830.0" y="194.5" font-size="23" fill="#17324d" text-anchor="middle">控制流与数据流</text><text x="830.0" y="226.5" font-size="23" fill="#17324d" text-anchor="middle">分支、值与依赖</text><path d="M830 255 L830.0 328.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="830,340 836.0,328.0 824.0,328.0" fill="#2563eb"/><rect x="370" y="350" width="590" height="100" rx="14" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="665.0" y="392.0" font-size="23" fill="#17324d" text-anchor="middle">反编译：恢复高级表达</text><text x="665.0" y="424.0" font-size="23" fill="#17324d" text-anchor="middle">类型、循环与函数原型是推断</text><text x="45" y="510" font-size="24" fill="#17324d" text-anchor="start">未解决的间接跳转 → 保留未知目标，而非假定无后继。</text><text x="45" y="552" font-size="23" fill="#17324d" text-anchor="start">可读的伪代码仍需位宽、边界输入和外部模型验证。</text></g></svg>