<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900"><rect width="760" height="900" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="55" font-size="31" fill="#1b3552" text-anchor="start">从具体化简到一般保持定理</text><text x="32" y="100" font-size="24" fill="#1b3552" text-anchor="start">CompilerModel.v 独立教学模型，不是 CompCert</text><rect x="50" y="150" width="660" height="110" rx="16" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="380.0" y="196.0" font-size="26" fill="#1b3552" text-anchor="middle">输入表达式</text><text x="380.0" y="234.0" font-size="26" fill="#1b3552" text-anchor="middle">(x + 0) + (2 + 3)</text><path d="M380 267 L380.0 301.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="380,315 387.0,301.0 373.0,301.0" fill="#2563eb"/><rect x="50" y="325" width="660" height="110" rx="16" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="380.0" y="371.0" font-size="26" fill="#1b3552" text-anchor="middle">递归优化子树</text><text x="380.0" y="409.0" font-size="26" fill="#1b3552" text-anchor="middle">x + 0 → x；2 + 3 → 5</text><path d="M380 442 L380.0 476.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="380,490 387.0,476.0 373.0,476.0" fill="#2563eb"/><rect x="50" y="500" width="660" height="110" rx="16" fill="#e8f6f2" stroke="#0f766e" stroke-width="2"/><text x="380.0" y="546.0" font-size="26" fill="#1b3552" text-anchor="middle">合成结果 x + 5</text><text x="380.0" y="584.0" font-size="26" fill="#1b3552" text-anchor="middle">在 x = 10 的环境中，两者均为 15</text><path d="M380 617 L380.0 651.0" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="380,665 387.0,651.0 373.0,651.0" fill="#2563eb"/><rect x="50" y="675" width="660" height="140" rx="16" fill="#e8f6f2" stroke="#0f766e" stroke-width="2"/><text x="380.0" y="717.0" font-size="26" fill="#1b3552" text-anchor="middle">一般结论：对所有环境 ρ 与表达式 e</text><text x="380.0" y="755.0" font-size="26" fill="#1b3552" text-anchor="middle">eval ρ (optimize e) = eval ρ e</text><text x="380.0" y="793.0" font-size="26" fill="#1b3552" text-anchor="middle">结构归纳 + 局部引理</text><text x="380" y="865" font-size="24" fill="#1b3552" text-anchor="middle">纯自然数模型；不含浮点、I/O 与机器溢出</text></g></svg>